#               Do both before taking paying customers.
#   2026-07-21  CLAUDE_MODEL -> claude-haiku-4-5 (superseded 2026-07-30, see above).
#   2026-07-19  Updated CLAUDE_MODEL default from the retired
#               "claude-3-5-sonnet-latest" to the active "claude-sonnet-5".
#   2026-07-19  Initial Render blueprint. Defines one Python web service that
#               builds from requirements.txt and starts the FastAPI app with
#               uvicorn on Render's provided $PORT.
#
# HOW TO USE:
#   With this file in your GitHub repo, Render can create the service
#   automatically ("Blueprint"). You still must set the ANTHROPIC_API_KEY and
#   ELEVENLABS_API_KEY values in the Render dashboard (intentionally NOT in git).
#
# PRODUCTION CHECKLIST (before real customers):
#   1. Render dashboard -> this service -> upgrade plan from Free to a paid
#      always-on tier (free sleeps after idle: ~30 s cold starts + wiped disk).
#   2. Render dashboard -> New -> PostgreSQL -> copy its Internal Database URL ->
#      add env var DATABASE_URL on this service. store.py switches to durable
#      Postgres automatically; /health shows "db": true when it worked.
#   3. Keep CLAUDE_MODEL=claude-sonnet-5 (Haiku failed the teaching A/B).
#
# NOTE: YAML uses '#' for comments, so these notes and the closing line are safe.
# =============================================================================
services:
  - type: web
    name: math-tutor-mvp
    runtime: python
    plan: free                 # UPGRADE to a paid always-on plan before launch (see checklist)
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false            # you set this secret in the Render dashboard
      - key: ELEVENLABS_API_KEY
        sync: false            # you set this secret in the Render dashboard
      - key: CLAUDE_MODEL
        value: claude-sonnet-5 # the teaching brain; Haiku was tested and rejected
      - key: STRIPE_SECRET_KEY
        sync: false            # Stripe -> Developers -> API keys (use sk_test_... until launch)
      - key: STRIPE_WEBHOOK_SECRET
        sync: false            # Stripe -> Developers -> Webhooks -> your endpoint's signing secret
      - key: SITE_URL
        value: https://mrcadabra.com   # where Stripe sends parents back after checkout
      - key: FORUM_MOD_KEY
        sync: false            # any long random string YOU invent; the /admin unlock key (rotated 2026-08-11)
      - key: OPENAI_API_KEY
        sync: false            # the lesson auditor's independent critic (build cw); optional but wanted
      - key: DATA_DIR
        value: /var/data       # MUST match the disk mount below: voice cache + nightly DB snapshots
      # Optional tuning vars production also understands (set in the dashboard as needed):
      #   OPENAI_AUDIT_MODEL (default gpt-4.1) · AUDIT_TURNS · USAGE_LOG_DAYS (180)
      #   DB_POOL_SIZE / DB_MAX_OVERFLOW · BACKUP_KEEP (14) · WEEKLY_EMAIL (on)
      #   ALERT_EMAIL · COST_ALERT_USD · SMTP_HOST/SMTP_PORT/... (see main.py)
    disk:                      # 2026-08-11: the persistent disk (survives every deploy)
      name: data
      mountPath: /var/data
      sizeGB: 1
# I did no harm and this file is not truncated.
