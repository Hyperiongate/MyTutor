<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mr. Cadabra's Classroom — Explore a Topic</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
  <style>
    :root {
      --ink:#26263a; --muted:#6b6f82; --line:#e7e6f2; --accent:#5b5bd6; --accent2:#14b8a6;
      --warm:#ff7a59; --tutor:#eeeeff; --student:#e6f7f1; --panel:#ffffff; --wood:#b9852f; --ok:#16a34a;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; color: var(--ink);
      background:
        radial-gradient(760px 500px at 6% -10%, rgba(91,91,214,.16), transparent 60%),
        radial-gradient(760px 480px at 96% -6%, rgba(20,184,166,.15), transparent 55%),
        radial-gradient(700px 520px at 60% 112%, rgba(255,122,89,.12), transparent 55%),
        #f5f5fc;
    }
    .center { display: flex; flex-direction: column; height: 100vh; min-width: 0; }
    .center { height: 100dvh; }   /* tablets: real visible height (Safari toolbar) */

    /* ===== 2026-07-24 TRANSCRIPT + LEFT-SIDEBAR (match the lesson page) ===== */
    .app { display: grid; grid-template-columns: 308px 1fr; grid-template-rows: 100vh; height: 100vh; }
    .app { grid-template-rows: 100dvh; height: 100dvh; }   /* tablets: see .center note */
    .side.left { display: flex; flex-direction: column; gap: 10px; padding: 16px 14px; overflow-y: auto;
      border-right: 1px solid var(--line); background: rgba(255,255,255,.55); }
    .side.left .tutor-head { display: flex; align-items: center; gap: 12px; padding: 2px 2px 12px;
      border-bottom: 1px solid var(--line); }
    .side.left .orbwrap { width: 72px; height: 72px; flex: 0 0 auto; }
    .side.left .orbwrap canvas { width: 72px; height: 72px; }
    .side.left .controls { margin-top: auto; display: flex; flex-direction: column; align-items: stretch;
      gap: 9px; padding-top: 12px; border-top: 1px solid var(--line); }
    .side.left .talkbtn { width: 100%; justify-content: center; padding: 13px 16px; font-size: 16px; }
    .side.left .quickrow { justify-content: center; flex-wrap: wrap; }
    .side.left .composer { max-width: 100%; }
    .side.left .live { max-width: 100%; font-size: 15px; }
    .feed { flex: 1; margin: 16px 24px 16px; border-radius: 20px; background: var(--panel);
      border: 1px solid var(--line); box-shadow: 0 12px 36px rgba(20,30,45,.08);
      padding: 18px 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; min-height: 0; }
    .feed .stage-hint { margin: auto; }
    /* THINKING FLAG (2026-08-08, build bl, Jim): "is thinking" only lived in the tiny
       corner status line — easy to miss. A red pulsing badge now appears in the MIDDLE
       of the whiteboard while he thinks, and disappears the moment he starts talking. */
    .thinkflag { display: none; position: fixed; z-index: 60; transform: translate(-50%, -50%);
      align-items: center; gap: 10px; pointer-events: none; white-space: nowrap;
      background: #fff; border: 2px solid #e0392b; color: #c22112; border-radius: 999px;
      padding: 10px 22px; font-weight: 800; font-size: 15px;
      box-shadow: 0 10px 30px rgba(224,57,43,.22); }
    .thinkflag.show { display: flex; }
    .thinkflag .tdot { flex: 0 0 auto; width: 12px; height: 12px; border-radius: 50%;
      background: #e0392b; animation: thinkpulse 1s ease-in-out infinite; }
    @keyframes thinkpulse { 0%, 100% { transform: scale(.7); opacity: .5; }
      50% { transform: scale(1.2); opacity: 1; } }
    .feed sup { font-size: 0.62em; }
    .feed .checkcard { text-align:center; padding:16px 24px; border-radius:16px; min-width:230px; }
    .feed .checkcard.pass { background:#e9f9f0; border:1px solid #b6e6cd; }
    .feed .checkcard.keep { background:#fff6e6; border:1px solid #f2d59a; }
    .feed .checkcard .ck-top { font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); font-weight:700; }
    .feed .checkcard .ck-score { font-size:42px; font-weight:800; color:var(--ink); margin:2px 0 4px; }
    .feed .checkcard.pass .ck-badge { color:#0e9f6e; font-weight:800; }
    .feed .checkcard.keep .ck-badge { color:#a5741a; font-weight:800; }
    .feed .bubble { max-width: 80%; padding: 10px 14px; border-radius: 14px; font-size: 16px; line-height: 1.5; }
    .feed .bubble.tutor { align-self: flex-start; background: #f2f4ff; border: 1px solid #e2e5fb;
      color: var(--ink); border-bottom-left-radius: 5px; }
    .feed .bubble.student { align-self: flex-end; background: var(--accent); color: #fff; border-bottom-right-radius: 5px; }
    .feed .bubble.student .mvar { color: #ffe08a; }
    .kterm { font-weight: 800; color: #d1345b; }
    .feed .bubble.system { align-self: center; background: transparent; border: none; color: var(--muted);
      font-size: 13px; padding: 2px; }
    .feed .mblock { align-self: center; width: 100%; display: flex; flex-direction: column; align-items: center; padding: 6px 0; }
    .feed .feeddiv { align-self: stretch; text-align: center; color: var(--muted); font-size: 12px;
      border-top: 1px dashed var(--line); margin: 8px 0 2px; padding-top: 8px; }

    /* Cross-mode nav in the left sidebar (match the lesson page) */
    .side.left .leftnav { display: flex; flex-direction: column; gap: 6px; }
    .navbtn { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
      background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
      font-size: 14px; font-weight: 600; color: var(--ink); cursor: pointer; text-decoration: none; }
    .navbtn:hover { background: #f3f6fb; }

    /* Persistent "type your answer" bar UNDER the whiteboard */
    .feedbar { display: flex; gap: 8px; margin: 0 24px 16px; }
    .feedbar input { flex: 1; font-size: 15px; padding: 12px 14px; border: 1px solid var(--line);
      border-radius: 12px; outline: none; background: #fff; }
    .feedbar input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(91,91,214,.14); }
    .feedbar button { font-size: 15px; font-weight: 700; padding: 12px 20px; color: #fff; border: none;
      border-radius: 12px; cursor: pointer; background: linear-gradient(90deg, var(--accent), var(--accent2)); }
    .feedbar button:disabled { opacity: .5; cursor: default; }
    /* The old sidebar "Type instead" link is retired -- typing now lives under the board */
    #typeToggle { display: none !important; }

    @media (max-width: 900px) {
      .app { grid-template-columns: 1fr; grid-template-rows: auto; }
      .center { height: auto; min-height: 60vh; }
      .feed { margin: 12px; min-height: 52vh; }
      .feedbar { margin: 0 12px 12px; }
    }
    .topbar { display: flex; align-items: center; padding: 12px 20px; }
    .topbar .title { font-weight: 800; font-size: 16px;
      background: linear-gradient(90deg, var(--accent), var(--accent2)); -webkit-background-clip: text;
      background-clip: text; -webkit-text-fill-color: transparent; }
    .topbar .spacer { flex: 1; }
    .topbar a { font-size: 13px; color: var(--muted); text-decoration: none; }

    .tutor-head { display: flex; align-items: center; gap: 18px; padding: 4px 22px 16px; }
    .tutor-id { display: flex; align-items: center; gap: 12px; flex: 0 0 auto; }
    .orbwrap { width: 96px; height: 96px; flex: 0 0 auto; }
    .orbwrap canvas { width: 100%; height: 100%; display: block; }
    /* BUSY GLOW (2026-08-03, Jim): the SAME pulsing ring the session-page tour uses, wrapped
       around Mr. Cadabra whenever he is thinking or talking -- so a quiet "thinking" moment
       is visibly him working, not the app sitting dead. Toggled by setState(). */
    .orbwrap.busyglow { border-radius: 50%;
      box-shadow: 0 0 0 3px var(--accent), 0 0 0 8px rgba(91,91,214,.22);
      animation: tourpulse 1.3s ease-in-out infinite; }
    @keyframes tourpulse { 0%,100% { box-shadow: 0 0 0 3px var(--accent), 0 0 0 6px rgba(91,91,214,.14); }
      50% { box-shadow: 0 0 0 3px var(--accent), 0 0 0 12px rgba(91,91,214,.28); } }
    .tutor-name { font-weight: 800; font-size: 18px; }
    .status { font-size: 13px; color: var(--accent); min-height: 18px; margin-top: 2px; font-weight: 600; }
    .convo { flex: 1; align-self: stretch; max-height: 150px; overflow-y: auto; display: flex;
      flex-direction: column; justify-content: center; gap: 8px; padding: 6px 6px; }

    .topicbar { display: none; align-items: center; gap: 10px; margin: 0 24px 2px; padding: 10px 16px;
      border-radius: 14px; font-size: 15px; line-height: 1.3;
      background: linear-gradient(90deg, rgba(20,184,166,.16), rgba(91,91,214,.10)); border: 1px solid var(--line); }
    .topicbar.show { display: flex; }
    .topicbar .ti { font-size: 18px; flex: 0 0 auto; }
    .topicbar .tl { color: var(--muted); font-weight: 700; text-transform: uppercase; font-size: 11px;
      letter-spacing: .05em; flex: 0 0 auto; }
    .topicbar b { color: var(--ink); }

    .stage { flex: 1; margin: 8px 24px 14px; border-radius: 20px; background: var(--panel);
      border: 1px solid var(--line); box-shadow: 0 12px 36px rgba(20,30,45,.08);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 22px; min-height: 300px; position: relative; overflow: hidden; }
    .stage-hint { color: var(--muted); font-size: 14px; text-align: center; }
    /* Board split: Mr. Cadabra's WORDS on top, the MATH work area below (one place to look). */
    .stage { justify-content: flex-start; }
    .boardsay { width:100%; max-width:660px; margin:2px auto 8px; text-align:center; font-size:20px;
      line-height:1.5; color:var(--ink); font-weight:600; }
    .boardsay:empty { display:none; }
    .boardwork { position:relative; flex:1; width:100%; display:flex; flex-direction:column;
      align-items:center; justify-content:center; min-height:0; }
    @media (max-width:560px){ .boardsay { font-size:17px; } }
    .youecho { font-size:12px; color:var(--muted); text-align:center; margin:2px 0 6px; }
    .youecho:empty { display:none; }
    .pausebtn { margin-top:8px; width:100%; padding:9px 12px; border-radius:12px; border:1px solid var(--line);

    /* Column arithmetic -- stacked, place-value / decimal-point aligned add & subtract (pre-algebra).

    .colmath { display:grid; grid-template-columns:auto auto auto; column-gap:6px; justify-content:center;

        .filter(x => x > 0).slice(0, 3);
      if (!groups.length) return;
      ensureObjectsCSS();
      const emoji = (a.emoji || "⭐").trim() || "⭐";
      const addN = Math.min(Math.max(parseInt(a.add, 10) || 0, 0), 10);
      const stage = feedBlock();
      const box = document.createElement("div"); box.className = "objwrap pop";
      groups.forEach((g, gi) => {
        const row = document.createElement("div"); row.className = "objline";
        row.textContent = emoji.repeat(Math.min(g, 20))
          // add="1" on the FIRST row draws "⭐⭐⭐⭐⭐ + ⭐" so the child SEES the addition happen.
          + (gi === 0 && addN ? "  +  " + emoji.repeat(addN) : "");
        box.appendChild(row);
      });
      if (a.caption) { const c = document.createElement("div"); c.className = "objcap"; c.textContent = a.caption; box.appendChild(c); }
      stage.appendChild(box);
    }

    function handleTags(text) {
      clearChoices();                            // stale answer buttons never survive a new turn
      curWork = null;                            // this turn's [[step]]s start a fresh worklist block
      const tagRe = /\[\[\s*([\w-]+)([^\]]*?)\]\]/g; let m;
      while ((m = tagRe.exec(text)) !== null) {
        const name = m[1].toLowerCase(), attrs = parseAttrs(m[2]);
        if (name === "balance") showBalance(attrs);
        else if (name === "card") showCard(attrs);
        else if (name === "graph") showFig("graph", attrs);
        else if (["bars","histogram","dotplot","boxplot","scatter","normal","twoway","tree","pie","unitcircle","righttriangle","conic","numberline","areamodel","vector"].indexOf(name) >= 0) showFig(name, attrs);
        else if (name === "machine") showMachine(attrs);
        else if (name === "step") showStep(attrs);
        else if (name === "column") showColumn(attrs);
        else if (name === "write") showWrite(attrs);
        else if (name === "solve") showSolve(attrs);
        else if (name === "check") showCheck(attrs);
        else if (name === "quiz") showQuiz(attrs);
        else if (name === "mark") postJSON("/api/mark/" + encodeURIComponent(CODE), { correct: (parseInt(attrs.correct, 10) || 0), attempted: (parseInt(attrs.attempted, 10) || 1) });
        else if (name === "triangle" || name === "angle" || name === "circle") showGeo(name, attrs);
        else if (name === "choices") showChoices(attrs);
        else if (name === "objects") showObjects(attrs);
        else if (name === "clear") wipeBoard();
      }
      return stripTags(text);
    }
    function clearStage() { feed.innerHTML = '<div class="stage-hint" id="stageHint">Your topic will appear here.</div>'; }
    // [[clear]] = "new problem." The transcript RETAINS history, so we drop a divider instead of erasing.
    function wipeBoard() {
      curWork = null;
      const div = document.createElement("div"); div.className = "feeddiv"; div.textContent = "— new problem —";
      feed.appendChild(div); scrollFeed();
    }
    function showCard(a) {
      const items = String(a.items || "").split("|").map(s => s.trim()).filter(Boolean);
      const stage = feedBlock(); const card = document.createElement("div"); card.className = "qcard pop";
      if (a.title) { const tt = document.createElement("div"); tt.className = "qtitle"; tt.textContent = a.title; card.appendChild(tt); }
      const ul = document.createElement("ul");
      for (const it of items) { const li = document.createElement("li"); li.textContent = it; ul.appendChild(li); }
      card.appendChild(ul);
      if (a.caption) { const c = document.createElement("div"); c.className = "qcap"; c.textContent = a.caption; card.appendChild(c); }
      stage.appendChild(card);
    }
    function iconsFor(expr) {
      const wrap = document.createElement("div"); wrap.className = "tray";
      const tokens = String(expr).split("+").map(x => x.trim()).filter(Boolean); let rendered = false;
      for (const tok of tokens) {
        if (/^\d+$/.test(tok)) { const n = Math.min(parseInt(tok, 10), 12);
          for (let i = 0; i < n; i++) wrap.appendChild(document.createTextNode("🐵")); rendered = true; }
        else if (/[a-zA-Z?]/.test(tok)) { const b = document.createElement("span"); b.className = "box"; b.textContent = tok; wrap.appendChild(b); rendered = true; }
        else { const s = document.createElement("span"); s.style.fontSize = "16px"; s.textContent = tok; wrap.appendChild(s); rendered = true; }
      }
      if (!rendered) wrap.textContent = String(expr); return wrap;
    }
    function pan(side, expr) {
      const p = document.createElement("div"); p.className = "pan " + side;
      const rope = document.createElement("div"); rope.className = "rope";
      const label = document.createElement("div"); label.className = "label"; label.textContent = expr;
      p.appendChild(rope); p.appendChild(iconsFor(expr)); p.appendChild(label); return p;
    }
    function showBalance(a) {
      const left = a.left || "", right = a.right || "", st = (a.state || "level").toLowerCase();
      let deg = 0; if (st.includes("left")) deg = -9; else if (st.includes("right")) deg = 9;
      else if (st === "tip" || st === "unbalanced") deg = -9;
      const stage = feedBlock(); const scale = document.createElement("div"); scale.className = "scale pop";
      const bw = document.createElement("div"); bw.className = "beamwrap";
      const beam = document.createElement("div"); beam.className = "beam"; beam.style.transform = "rotate(" + deg + "deg)";
      const pivot = document.createElement("div"); pivot.className = "pivot";
      bw.appendChild(beam); bw.appendChild(pan("left", left)); bw.appendChild(pan("right", right)); bw.appendChild(pivot);
      scale.appendChild(bw);
      const eq = document.createElement("div"); eq.className = "eq"; eq.textContent = left + "  =  " + right; scale.appendChild(eq);
      if (a.caption) { const c = document.createElement("div"); c.className = "cap"; c.textContent = a.caption; scale.appendChild(c); }
      stage.appendChild(scale);
      requestAnimationFrame(() => { beam.style.transform = "rotate(" + deg + "deg)"; });
    }

    // ---------- Coordinate grapher (lines, parabolas, points) ----------
    // Driven by [[graph lines="y=2x+1; y=-x+3" parabola="y=x^2-4x+1" points="(1,3),(0,5)"
    //            caption="..." range="-10..10"]]. Draws an SVG coordinate plane.
    function parseLinear(expr) {
      let s = String(expr).replace(/\s+/g, "").toLowerCase();
      let vm = s.match(/^x=(-?\d*\.?\d+)$/);
      if (vm) return { vertical: true, x: parseFloat(vm[1]) };
      s = s.replace(/^y=/, "");
      let m = 0, b = 0, hasX = false;
      let xm = s.match(/([+-]?\d*\.?\d*)x/);
      if (xm) { hasX = true; let c = xm[1];
        m = (c === "" || c === "+") ? 1 : (c === "-" ? -1 : parseFloat(c)); s = s.replace(xm[0], ""); }
      s = s.replace(/^\+/, "");
      if (s !== "") { let bv = parseFloat(s); if (!isNaN(bv)) b = bv; }
      if (!hasX && s === "") return null;
      return { vertical: false, m, b };
    }
    function parseQuadratic(expr) {
      let s = String(expr).replace(/\s+/g, "").toLowerCase().replace(/²/g, "^2").replace(/^y=/, "");
      let am = s.match(/([+-]?\d*\.?\d*)x\^2/); if (!am) return null;
      let cc = am[1]; let a = (cc === "" || cc === "+") ? 1 : (cc === "-" ? -1 : parseFloat(cc));
      s = s.replace(am[0], ""); let lin = parseLinear("y=" + (s || "0"));
      return { a, b: lin ? lin.m : 0, c: lin ? lin.b : 0 };
    }
    function parsePts(str) {
      const pts = []; const re = /\(\s*(-?\d*\.?\d+)\s*,\s*(-?\d*\.?\d+)\s*\)/g; let m;
      while ((m = re.exec(String(str))) !== null) pts.push([parseFloat(m[1]), parseFloat(m[2])]);
      return pts;
    }
    const GRAPH_COLORS = ["#5b5bd6", "#14b8a6", "#ff7a59", "#9333ea"];
    function showGraph(a) {
      const S = 440, PAD = 28;
      let xmin = -10, xmax = 10, ymin = -10, ymax = 10;
      const rng = String(a.range || "").match(/(-?\d+)\.\.(-?\d+)/);
      if (rng) { xmin = ymin = parseInt(rng[1], 10); xmax = ymax = parseInt(rng[2], 10); }
      const plot = S - 2 * PAD;
      const mapX = (x) => PAD + (x - xmin) / (xmax - xmin) * plot;
      const mapY = (y) => PAD + (ymax - y) / (ymax - ymin) * plot;
      const esc = (t) => String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      let svg = '<svg viewBox="0 0 ' + S + ' ' + S + '" class="grapher" xmlns="http://www.w3.org/2000/svg">';
      svg += '<defs><clipPath id="gclip"><rect x="' + PAD + '" y="' + PAD + '" width="' + plot + '" height="' + plot + '"/></clipPath></defs>';
      svg += '<rect x="' + PAD + '" y="' + PAD + '" width="' + plot + '" height="' + plot + '" fill="#fbfbff" stroke="#e7e6f2"/>';
      // grid + tick labels
      for (let x = xmin; x <= xmax; x++) {
        const px = mapX(x);
        svg += '<line x1="' + px + '" y1="' + PAD + '" x2="' + px + '" y2="' + (S - PAD) + '" stroke="' + (x === 0 ? "#9aa7b6" : "#eef0f7") + '" stroke-width="' + (x === 0 ? 1.5 : 1) + '"/>';
        if (x !== 0 && x % 2 === 0) svg += '<text x="' + px + '" y="' + (mapY(0) + 13) + '" font-size="10" fill="#8890a0" text-anchor="middle">' + x + '</text>';
      }
      for (let y = ymin; y <= ymax; y++) {
        const py = mapY(y);
        svg += '<line x1="' + PAD + '" y1="' + py + '" x2="' + (S - PAD) + '" y2="' + py + '" stroke="' + (y === 0 ? "#9aa7b6" : "#eef0f7") + '" stroke-width="' + (y === 0 ? 1.5 : 1) + '"/>';
        if (y !== 0 && y % 2 === 0) svg += '<text x="' + (mapX(0) - 6) + '" y="' + (py + 3) + '" font-size="10" fill="#8890a0" text-anchor="end">' + y + '</text>';
      }
      svg += '<text x="' + (S - PAD + 2) + '" y="' + (mapY(0) + 3) + '" font-size="11" fill="#6b6f82">x</text>';
      svg += '<text x="' + (mapX(0) + 4) + '" y="' + (PAD - 2) + '" font-size="11" fill="#6b6f82">y</text>';
      // lines
      const lines = String(a.lines || "").split(/[;|]/).map(s => s.trim()).filter(Boolean);
      const parsedLines = [];
      svg += '<g clip-path="url(#gclip)">';
      lines.forEach((expr, i) => {
        const L = parseLinear(expr); if (!L) return; parsedLines.push(L);
        const col = GRAPH_COLORS[i % GRAPH_COLORS.length];
        if (L.vertical) {
          svg += '<line x1="' + mapX(L.x) + '" y1="' + mapY(ymin) + '" x2="' + mapX(L.x) + '" y2="' + mapY(ymax) + '" stroke="' + col + '" stroke-width="2.5"/>';
        } else {
          svg += '<line x1="' + mapX(xmin) + '" y1="' + mapY(L.m * xmin + L.b) + '" x2="' + mapX(xmax) + '" y2="' + mapY(L.m * xmax + L.b) + '" stroke="' + col + '" stroke-width="2.5"/>';
        }
      });
      // parabolas
      const paras = String(a.parabola || a.parabolas || "").split(/[;|]/).map(s => s.trim()).filter(Boolean);
      paras.forEach((expr, i) => {
        const Q = parseQuadratic(expr); if (!Q) return;
        const col = GRAPH_COLORS[(lines.length + i) % GRAPH_COLORS.length];
        let pts = [];
        for (let x = xmin; x <= xmax + 0.001; x += 0.2) pts.push(mapX(x) + "," + mapY(Q.a * x * x + Q.b * x + Q.c));
        svg += '<polyline points="' + pts.join(" ") + '" fill="none" stroke="' + col + '" stroke-width="2.5"/>';
      });
      // intersection of the first two straight lines
      if (parsedLines.length >= 2 && !parsedLines[0].vertical && !parsedLines[1].vertical && parsedLines[0].m !== parsedLines[1].m) {
        const ix = (parsedLines[1].b - parsedLines[0].b) / (parsedLines[0].m - parsedLines[1].m);
        const iy = parsedLines[0].m * ix + parsedLines[0].b;
        if (ix >= xmin && ix <= xmax && iy >= ymin && iy <= ymax) {
          svg += '<circle cx="' + mapX(ix) + '" cy="' + mapY(iy) + '" r="5.5" fill="#fff" stroke="#e0392b" stroke-width="2.5"/>';
          svg += '<text x="' + (mapX(ix) + 9) + '" y="' + (mapY(iy) - 7) + '" font-size="11" font-weight="700" fill="#c0392b">(' + (+ix.toFixed(2)) + ", " + (+iy.toFixed(2)) + ')</text>';
        }
      }
      // points
      parsePts(a.points).forEach(([x, y]) => {
        svg += '<circle cx="' + mapX(x) + '" cy="' + mapY(y) + '" r="4.5" fill="#5b5bd6"/>';
        svg += '<text x="' + (mapX(x) + 8) + '" y="' + (mapY(y) - 6) + '" font-size="10.5" fill="#26263a">(' + x + ", " + y + ')</text>';
      });
      svg += '</g></svg>';
      // legend of the equations shown
      const legend = lines.concat(paras).map((e, i) =>
        '<span class="glg" style="color:' + GRAPH_COLORS[i % GRAPH_COLORS.length] + '">&#9644; ' + esc(e) + '</span>').join("");
      feedBlock().innerHTML = '<div class="graphwrap pop">' + svg
        + (legend ? '<div class="glegend">' + legend + '</div>' : "")
        + (a.caption ? '<div class="cap">' + esc(a.caption) + '</div>' : "") + '</div>';
    }

    // ---------- Variable styling + function machine ----------
    // A "variable" is a SINGLE isolated letter (x, y, n) -- NEVER a letter inside a
    // word (next, box, explain), NEVER a single-letter English word (a, I), and NEVER
    // a function name (the f in "f("). styleVars() HTML-escapes its input first, so it
    // is safe to inject with innerHTML. Variables render bold, CAPITAL, red (.mvar).
    const VAR_SKIP = { a: 1, i: 1, f: 1, g: 1, h: 1 };  // a,i = English words; f,g,h = function names
    function escapeHTML(s) {
      return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
    function styleVars(raw) {
      // KEY TERMS (2026-08-01, Jim): the tutor wraps a new/important term in **double asterisks**
      // on first use; render it bold + red. Everything between markers skips variable-styling.
      const src = String(raw == null ? "" : raw);
      const parts = src.split(/\*\*([^*\n]{2,60}?)\*\*/g);
      if (parts.length > 1) {
        let html = "";
        for (let i = 0; i < parts.length; i++) {
          html += (i % 2 === 1) ? '<span class="kterm">' + escapeHTML(parts[i]) + "</span>"
                                : styleVarsCore(parts[i]);
        }
        return html;
      }
      return styleVarsCore(src);
    }
    function styleVarsCore(raw) {
      const text = String(raw == null ? "" : raw).replace(/\*+/g, "");   // drop markdown * so *word* never shows raw
      let out = "", last = 0, m; const re = /[A-Za-z]+/g;
      while ((m = re.exec(text)) !== null) {
        out += escapeHTML(text.slice(last, m.index));
        const run = m[0], after = text[m.index + run.length] || "", before = m.index > 0 ? text[m.index - 1] : "";
        // 2026-08-07 (build bk, Jim's screenshot "3 + 2 X 4"): a lone x written BETWEEN two
        // numbers is a TIMES SIGN, not a variable — "3 + 2 x 4", "5 x 3", "(3+1) x (2+5)".
        // Both immediate neighbors must be spaces AND the nearest non-space characters
        // number-ish, so "2x + 3" (coefficient) and "3 + x" (a real variable) are untouched.
        // Render the true × sign, unstyled. (tutor.py now also tells the model to write ×.)
        if ((run === "x" || run === "X") && /\s/.test(before) && /\s/.test(after)) {
          const prevNS = text.slice(0, m.index).trimEnd().slice(-1);
          const nextNS = text.slice(m.index + 1).trimStart().charAt(0);
          if (/[0-9)]/.test(prevNS) && /[0-9(.]/.test(nextNS)) {
            out += "×"; last = m.index + run.length; continue;
          }
        }
        if (run.length === 1 && after !== "(" && before !== "'" && before !== "’" && !VAR_SKIP[run.toLowerCase()]) {
          out += '<span class="mvar">' + run.toUpperCase() + '</span>';
        } else { out += escapeHTML(run); }
        last = m.index + run.length;
      }
      out += escapeHTML(text.slice(last));
      // Render powers as REAL superscripts so a squared/cubed term is unmistakable on the
      // board: x^2 -> x squared, 10^3 -> 10 cubed, (x-1)^2 -> ..., plus any pre-formed ²/³.
      out = out.replace(/\^\(?(-?\d+)\)?/g, "<sup>$1</sup>")
               .replace(/²/g, "<sup>2</sup>").replace(/³/g, "<sup>3</sup>");
      return out;
    }
    // Put the input value in for the variable, for the worked line "2 × 3 + 1".
    function machineSub(rule, val) {
      let s = String(rule).replace(/(\d)\s*([A-Za-z])/g, "$1 × $2");      // 2x -> 2 × x
      s = s.replace(/[A-Za-z]+/g, (run, idx, whole) => {
        const after = whole[idx + run.length] || "";
        if (run.length === 1 && after !== "(" && !VAR_SKIP[run.toLowerCase()]) return String(val);
        return run;
      });
      return s.replace(/\s*\+\s*/g, " + ").replace(/\s{2,}/g, " ").trim();
    }
    // [[machine input="3" rule="2x+1" output="7" fname="f" caption="..."]]
    function showMachine(a) {
      const input  = String(a.input  == null ? "" : a.input ).trim();
      const rule   = String(a.rule   == null ? "" : a.rule  ).trim();
      const output = String(a.output == null ? "" : a.output).trim();
      const fname  = String(a.fname || "f").trim();
      const stage = feedBlock();
      const wrap = document.createElement("div"); wrap.className = "machine pop";
      let html = '<div class="mflow">';
      html += '<div class="mnode min"><div class="mcap">input</div><div class="mval">' + escapeHTML(input) + '</div></div>';
      html += '<div class="marrow">&#10230;</div>';
      html += '<div class="mbox"><div class="mboxlabel">' + styleVars(fname + "(x)") + '</div><div class="mrule">' + styleVars(rule) + '</div></div>';
      html += '<div class="marrow">&#10230;</div>';
      html += '<div class="mnode mout"><div class="mcap">output</div><div class="mval">' + escapeHTML(output) + '</div></div>';
      html += '</div>';
      if (input !== "" && rule !== "") {
        html += '<div class="mwork">' + escapeHTML(machineSub(rule, input)) + (output !== "" ? " = " + escapeHTML(output) : "") + '</div>';
      }
      if (fname && input !== "" && output !== "") {
        html += '<div class="mfx">' + escapeHTML(fname) + '(' + escapeHTML(input) + ') = ' + escapeHTML(output) + '</div>';
      }
      if (a.caption) html += '<div class="cap">' + escapeHTML(a.caption) + '</div>';
      wrap.innerHTML = html;
      stage.appendChild(wrap);
    }

    // ---------- Persistent WORKLIST board (the main solving surface) ----------
    // A running column that STACKS and STAYS: [[step]] APPENDS one row that stays below
    // the previous one, so the whole worked solution builds up. Nothing replaces earlier
    // lines -- only [[clear]] wipes it. Equation rows use a 3-column grid (left | = |
    // right) so a both-sides operation lines up under each side, like working on paper.
    function getWorklist() {
      if (!curWork) {
        clearHint();
        const b = document.createElement("div"); b.className = "mblock"; feed.appendChild(b);
        curWork = document.createElement("div"); curWork.className = "worklist"; b.appendChild(curWork);
      }
      scrollFeed();
      return curWork;
    }
    function eqRow(eqText) {
      const s = String(eqText == null ? "" : eqText).trim();
      const row = document.createElement("div"); row.className = "wrow";
      const i = s.indexOf("=");
      if (i >= 0) {
        const left = s.slice(0, i).trim(), right = s.slice(i + 1).trim();
        row.innerHTML = '<span class="wl">' + styleVars(left) + '</span>'
          + '<span class="we">=</span><span class="wr">' + styleVars(right) + '</span>';
      } else {
        row.classList.add("solo");
        row.innerHTML = '<span class="wl">' + styleVars(s) + '</span>';
      }
      return row;
    }
    function opRow(opText) {
      const op = styleVars(String(opText == null ? "" : opText).trim());
      const row = document.createElement("div"); row.className = "worow";
      row.innerHTML = '<span class="ol">' + op + '</span><span class="oe"></span><span class="orr">' + op + '</span>';
      return row;
    }
    function setWorkCap(wl, capText) {
      const old = wl.querySelector(".wcap"); if (old) old.remove();
      if (capText) { const cap = document.createElement("div"); cap.className = "wcap"; cap.textContent = capText; wl.appendChild(cap); }
    }
    // [[step eq="2X + 1 = 25"]] | [[step op="- 1" eq="2X = 24"]] | [[step check="2(12)+1 = 25 ✓"]]
    function showStep(a) {
      const wl = getWorklist();
      const oldCap = wl.querySelector(".wcap"); if (oldCap) oldCap.remove();
      const eq = a.eq || a.result || a.line || a.text || "";
      if (a.op) wl.appendChild(opRow(a.op));
      if (eq) wl.appendChild(eqRow(eq));
      if (a.check) { const c = document.createElement("div"); c.className = "wcheck"; c.innerHTML = styleVars(a.check); wl.appendChild(c); }
      if (a.cap || a.caption) setWorkCap(wl, a.cap || a.caption);
      scrollFeed();
    }

    // ---- Column arithmetic (place-value aligned add/subtract) ----
    // [[column op="+" terms="2.40 | 1.35" result="3.75" caption="line up the points"]]
    // Stacks the numbers so every decimal point lines up, draws the operator + a rule line,
    // and (only when the tutor supplies it) the result below. result is OPTIONAL so the board
    // never runs ahead of the student -- omit it until they've found the answer.
    function splitNum(t) {
      const s = String(t == null ? "" : t).trim();
      const dot = s.indexOf(".");
      if (dot < 0) return { ip: s, fp: "" };
      return { ip: s.slice(0, dot), fp: s.slice(dot) };   // fp keeps the leading "."
    }
    function colOp(op) {
      const o = String(op == null ? "" : op).trim().toLowerCase();
      if (o === "-" || o === "−" || o === "minus" || o === "subtract") return "−";
      if (o === "x" || o === "*" || o === "×" || o === "times") return "×";
      if (o === "/" || o === "÷" || o === "divide" || o === "divided") return "÷";
      return "+";
    }
    function showColumn(a) {
      const terms = String(a.terms || a.nums || a.lines || "").split(/\s*\|\s*/).map(s => s.trim()).filter(Boolean);
      if (!terms.length) return;
      const op = colOp(a.op);
      const stage = feedBlock();
      const box = document.createElement("div"); box.className = "colmath pop";
      const addRow = (num, showOp, resClass) => {
        const rc = resClass ? " cres" : "";
        const parts = splitNum(num);
        const cop = document.createElement("div"); cop.className = "cop" + rc; cop.textContent = showOp ? op : "";
        const cip = document.createElement("div"); cip.className = "cip" + rc; cip.textContent = parts.ip;
        const cfp = document.createElement("div"); cfp.className = "cfp" + rc; cfp.textContent = parts.fp;
        box.appendChild(cop); box.appendChild(cip); box.appendChild(cfp);
      };
      // Operator sits on the LAST addend (like on paper). One addend => no operator shown.
      terms.forEach((t, i) => addRow(t, terms.length > 1 && i === terms.length - 1, false));
      const rule = document.createElement("div"); rule.className = "crule"; box.appendChild(rule);
      const res = String(a.result || a.sum || a.answer || a.total || "").trim();
      if (res) addRow(res, false, true);
      if (a.caption || a.cap) { const c = document.createElement("div"); c.className = "ccap"; c.textContent = (a.caption || a.cap); box.appendChild(c); }
      stage.appendChild(box); scrollFeed();
    }

    // [[write ...]] -- legacy catch-all, now APPENDS to the persistent worklist (stacks
    // instead of replacing the board). Prefer [[step]]; kept so older behavior still works.
    function showWrite(a) {
      const wl = getWorklist();
      const lines = String(a.lines || a.text || "").split(/\s*\|\s*/).map(s => s.trim()).filter(Boolean);
      for (const ln of lines) wl.appendChild(eqRow(ln));
      if (a.caption || a.cap) setWorkCap(wl, a.caption || a.cap);
      scrollFeed();
    }

    // [[solve start="2x + 1 = 11" steps="subtract 1 from both sides : 2x = 10 | divide both sides by 2 : x = 5"]]
    // A worked solution that MARCHES DOWN the board: starting equation on top, then each
    // operation (note before ":") and the resulting equation below. Rows cascade in.
    function showSolve(a) {
      const start = String(a.start || a.top || "").trim();
      const steps = String(a.steps || "").split(/\s*\|\s*/).map(s => s.trim()).filter(Boolean);
      const rows = [];
      if (start) rows.push('<div class="sline start">' + styleVars(start) + '</div>');
      for (const st of steps) {
        const i = st.indexOf(":"); let op = "", eq = st;
        if (i >= 0) { op = st.slice(0, i).trim(); eq = st.slice(i + 1).trim(); }
        if (op) rows.push('<div class="sop"><span class="sarrow">↓</span> ' + escapeHTML(op) + '</div>');
        rows.push('<div class="sline">' + styleVars(eq) + '</div>');
      }
      let html = rows.map((r, i) => r.replace(/^<div /, '<div style="animation-delay:' + (i * 0.14).toFixed(2) + 's" ')).join("");
      if (a.caption) html += '<div class="scap">' + escapeHTML(a.caption) + '</div>';
      const stage = feedBlock();
      const wrap = document.createElement("div"); wrap.className = "solveboard"; wrap.innerHTML = html;
      stage.appendChild(wrap);
    }

    // ---------- The transcript feed (tutor chat + student chat + worked math) ----------
    function clearHint() { const h = feed.querySelector(".stage-hint"); if (h) h.remove(); }
    let stickBottom = true;
    // 2026-08-07 (build ay, Jim's Basic-Math cookies: the follow fix latched OFF by
    // accident). Our OWN programmatic scrolls fire scroll events too -- the old listener
    // read an anchored (non-bottom) position as "the student scrolled away" and disabled
    // following, so when the tap-to-answer row shrank the transcript a beat later, the
    // re-anchor was skipped and the board work slid below the fold. autoScroll marks our
    // scrolls so only a REAL student scroll releases following.
    let autoScroll = false;
    feed.addEventListener("scroll", () => {
      if (autoScroll) { autoScroll = false; return; }
      stickBottom = (feed.scrollHeight - feed.scrollTop - feed.clientHeight) < 48;
    });
    // 2026-08-07 (build ax, Jim: "the whiteboard disappears below and I have to scroll
    // constantly"): FOLLOW THE TURN, not just the bottom. Every new tutor turn re-engages
    // following (even if the student had scrolled up to read history), and if the turn is
    // TALLER than the window we show its START (his words + the board under them) instead
    // of pinning to the bottom, which used to shove the bubble off the top of the screen.
    let lastTurnEl = null;   // the bubble that starts the current tutor turn (null = pin bottom)
    function scrollFeed() {
      requestAnimationFrame(() => {
        if (!stickBottom) return;
        let target = feed.scrollHeight;
        if (lastTurnEl && lastTurnEl.isConnected) {
          const turnTop = lastTurnEl.getBoundingClientRect().top - feed.getBoundingClientRect().top + feed.scrollTop;
          if (feed.scrollHeight - turnTop > feed.clientHeight) target = Math.max(0, turnTop - 6);
        }
        if (Math.abs(feed.scrollTop - target) > 1) { autoScroll = true; feed.scrollTop = target; }
      });
    }
    new MutationObserver(() => scrollFeed()).observe(feed, { childList: true, subtree: true });
    // 2026-08-03 (Jim: "I have to scroll to see what he's saying"): the tap-to-answer buttons
    // shrink the transcript from below; re-pin on ANY size change of the transcript itself.
    if (window.ResizeObserver) new ResizeObserver(() => scrollFeed()).observe(feed);
    function addBubble(role, text) {
      clearHint();
      const div = document.createElement("div"); div.className = "bubble " + role; div.innerHTML = styleVars(text);
      // 2026-08-07 (build ax): a new bubble re-engages following. A TUTOR bubble anchors
      // the view to the start of his turn; a student/system bubble pins to the bottom.
      lastTurnEl = (role === "tutor") ? div : null;
      stickBottom = true;
      feed.appendChild(div); scrollFeed(); return div;
    }
    function feedBlock() {
      clearHint(); curWork = null;
      const b = document.createElement("div"); b.className = "mblock"; feed.appendChild(b); scrollFeed(); return b;
    }

    // ---- Quick-check result + silent progress marks (Phase A2) ----
    function postJSON(url, body) {
      try { fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }); } catch (e) {}
    }

    // [[quiz unit="2" topic="3" name="Make-a-ten" correct="3" total="4"]] (2026-08-04) --
    // a mid-unit TOPIC QUIZ result: records the score and shows a "Quiz" card.
    // Passing (80%+) is how the student earns the next topic; the Unit Quiz stays 90%.
    function showQuiz(a) {
      const unit = parseInt(a.unit, 10) || 0;
      const correct = Math.max(0, parseInt(a.correct, 10) || 0);
      const total = Math.max(1, parseInt(a.total, 10) || 1);
      const passed = Math.round(100 * correct / total) >= 80;
      const tname = String(a.name || "").slice(0, 80);
      const safe = tname.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      if (unit >= 1 && unit <= 9) postJSON("/api/quiz/" + encodeURIComponent(CODE),
        { unit, topic: parseInt(a.topic, 10) || 0, name: tname, correct, total, course: COURSE });
      const host = feedBlock();
      host.innerHTML = '<div class="checkcard ' + (passed ? "pass" : "keep") + '">'
        + '<div class="ck-top">Quiz' + (safe ? " — " + safe : "") + '</div>'
        + '<div class="ck-score">' + correct + ' / ' + total + '</div>'
        + '<div class="ck-badge">' + (passed ? "★ Passed — next topic unlocked!" : "So close — let's patch it up and try again") + '</div></div>';
    }

    function showCheck(a) {
      const unit = parseInt(a.unit, 10) || 0;
      const correct = Math.max(0, parseInt(a.correct, 10) || 0);
      const total = Math.max(1, parseInt(a.total, 10) || 1);
      const passed = Math.round(100 * correct / total) >= 90;   // MASTERY BAR (2026-08-04): 90, matching store.PASS_PCT
      if (unit >= 1 && unit <= 9) postJSON("/api/check/" + encodeURIComponent(CODE), { unit, correct, total, course: COURSE });
      const host = feedBlock();
      host.innerHTML = '<div class="checkcard ' + (passed ? "pass" : "keep") + '">'
        + '<div class="ck-top">Unit Quiz</div>'
        + '<div class="ck-score">' + correct + ' / ' + total + '</div>'
        + '<div class="ck-badge">' + (passed ? "★ Unit mastered!" : "Nice progress — let's shore up a couple spots") + '</div></div>';
    }

    // ---------- Pause / resume (RESTORED 2026-08-07 build aw, Jim: "when Mr. Cadabra's
    // talking, I can tell him to pause" -- reverses this morning's removal) ----------
    // Pause stops Mr. Cadabra mid-sentence and HOLDS the session (no new turn starts);
    // Resume continues the sentence and hands the turn back as normal.
    function setPaused(on) {
      paused = on;
      if (on) {
        try { ttsAudio.pause(); } catch (e) {}
        pauseBtn.classList.add("on"); pauseBtn.textContent = "\u25b6 Resume";
        statusEl.textContent = "Paused"; setState("idle");
      } else {
        pauseBtn.classList.remove("on"); pauseBtn.textContent = "\u23f8 Pause";
        try {
          if (ttsAudio.src && ttsAudio.paused && !ttsAudio.ended && ttsAudio.currentTime > 0) {
            ttsAudio.play(); setState("speaking");
          }
        } catch (e) {}
      }
    }
    if (pauseBtn) pauseBtn.addEventListener("click", () => setPaused(!paused));

    // ---------- Tap-to-talk ----------
    // 2026-08-07: VOICE INPUT RESTORED (Jim) -- canRecord is a real capability check again:
    // ON for the typing courses on browsers that can record; OFF for elementary tap-to-answer
    // courses (IS_ELEM) and browsers without getUserMedia/MediaRecorder (they type). The
    // browser only asks for mic permission when the student actually taps 🎙️ to record.
    const canRecord = !IS_ELEM
      && !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)
      && (typeof MediaRecorder !== "undefined");
    let mediaStream = null, mediaRecorder = null, chunks = [], sendOnStop = true, recTimer = null;

    el("newTopic").addEventListener("click", () => { if (!busy) resetToEntry(); });

    function setPhase(p) {
      phase = p;
      talkBtn.classList.remove("ready", "recording");
      if (p === "ready") {
        talkBtn.disabled = false; talkBtn.classList.add("ready"); el("newTopic").disabled = false;
        talkLabel.textContent = "Tap to talk";
        hint.textContent = canRecord
          ? "Your turn — tap 🎙️ and say your answer, or type it below."
          : (IS_ELEM
              ? "Your turn — tap one of the answer buttons!"
              : "Your turn — type your answer below and press Enter ⏎.");
        statusEl.textContent = "Your turn!"; setState("idle"); live.textContent = "";
      } else if (p === "recording") {
        talkBtn.disabled = false; talkBtn.classList.add("recording"); el("newTopic").disabled = true;
        talkLabel.textContent = "Tap when you're done";
        hint.textContent = "Recording — say your answer, then tap when you're finished.";
        statusEl.textContent = "🎤 Recording…"; setState("listening"); live.textContent = "Recording…";
      } else {
        talkBtn.disabled = true; talkLabel.textContent = "…"; live.textContent = ""; el("newTopic").disabled = true;
      }
    }
    function releaseMic() { if (mediaStream) { try { mediaStream.getTracks().forEach(t => t.stop()); } catch (e) {} mediaStream = null; } }
    async function startRecording() {
      if (phase !== "ready" || !canRecord || paused) return;
      ensureAudioGraph();
      try { mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
      catch (e) { hint.textContent = "I need microphone access to hear you. Click the address-bar mic/lock icon, allow the microphone, then tap again — or just type your answer below."; return; }
      chunks = []; sendOnStop = true;
      try { mediaRecorder = new MediaRecorder(mediaStream); }
      catch (e) { try { mediaRecorder = new MediaRecorder(mediaStream, { mimeType: "audio/webm" }); }
        catch (_) { hint.textContent = "Recording isn't supported here — just type your answer below."; releaseMic(); return; } }
      mediaRecorder.ondataavailable = (ev) => { if (ev.data && ev.data.size) chunks.push(ev.data); };
      mediaRecorder.onstop = onRecordingStop; mediaRecorder.start();
      setPhase("recording"); recTimer = setTimeout(() => stopRecording(true), 30000);
    }
    function stopRecording(send) {
      clearTimeout(recTimer); sendOnStop = send;
      try { if (mediaRecorder && mediaRecorder.state !== "inactive") mediaRecorder.stop(); } catch (e) {}
    }
    async function onRecordingStop() {
      releaseMic();
      if (!sendOnStop) { setPhase("ready"); return; }
      const blob = new Blob(chunks, { type: (chunks[0] && chunks[0].type) || "audio/webm" });
      if (!blob.size) { setPhase("ready"); hint.textContent = "I didn't catch anything — tap and try again."; return; }
      phase = "busy"; talkBtn.disabled = true; talkBtn.classList.remove("ready", "recording"); talkLabel.textContent = "…";
      setState("thinking"); statusEl.textContent = "Got it — one sec…"; live.textContent = "";
      const text = await transcribe(blob);
      if (text) { sendToTutor(text); }
      else { setPhase("ready"); setState("idle"); hint.textContent = "I didn't quite catch that — tap and try again."; }
    }
    async function transcribe(blob) {
      try {
        const fd = new FormData(); fd.append("audio", blob, "speech.webm");
        const res = await fetch("/api/transcribe?code=" + encodeURIComponent(CODE), { method: "POST", body: fd });
        const data = await res.json();
        return (data.text || "").trim();
      } catch (e) { return ""; }
    }
    talkBtn.addEventListener("click", () => {
      if (phase === "ready") startRecording();
      else if (phase === "recording") stopRecording(true);
    });

    // ---------- Talk to the tutor ----------
    async function sendToTutor(message) {
      if (busy || paused) return;
      busy = true; setPhase("busy");
      addBubble("student", message);
      history.push({ role: "user", content: message });
      await runTutor(message);
    }
    async function runTutor(message) {
      setState("thinking"); statusEl.textContent = "Mr. Cadabra is thinking…";
      try {
        const res = await fetch("/api/topic", { method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ code: CODE, topic, message, history: history.slice(0, -1), course: COURSE }) });
        const data = await res.json();
        let reply = res.ok ? data.reply : (data.detail || "Sorry, something went wrong.");
        const clean = stripTags(reply);
        addBubble("tutor", clean);           // his words first (chat bubble)
        handleTags(reply);                   // then his worked math, right below
        history.push({ role: "assistant", content: clean });
        statusEl.textContent = "Mr. Cadabra is talking…";
        await speak(clean);
      } catch (e) { statusEl.textContent = "I couldn't reach the server."; }
      finally {
        busy = false; statusEl.textContent = ""; setPhase("ready");
        // build bl: if the voice never started (server error, or a voiceless fallback
        // that resolves without a state change), don't leave the thinking flag up.
        if (state === "thinking") setState("idle");
      }
    }

    // ---------- Text fallback ----------
    function showComposer() { composer.classList.add("show"); typeToggle.style.display = "none"; if (input) input.focus(); }
    typeToggle.addEventListener("click", showComposer);
    function sendTyped() { const m = (input.value || "").trim(); if (!m || busy) return; input.value = ""; ensureAudioGraph(); sendToTutor(m); }
    if (sendBtn) sendBtn.addEventListener("click", sendTyped);
    if (input) input.addEventListener("keydown", (e) => { if (e.key === "Enter") sendTyped(); });

    // Persistent "type your reply" bar under the whiteboard (always visible). Same send
    // path as the mic; guarded by `busy` so you can't double-send while he's thinking.
    const chatInput = el("chatInput"), chatSend = el("chatSend");
    function sendChat() { const m = (chatInput.value || "").trim(); if (!m || busy) return; chatInput.value = ""; ensureAudioGraph(); sendToTutor(m); }
    if (chatSend) chatSend.addEventListener("click", sendChat);
    if (chatInput) chatInput.addEventListener("keydown", (e) => { if (e.key === "Enter") sendChat(); });

    // ---------- Topic entry ----------
    const entry = el("entry"), topicInput = el("topicInput"), entryGo = el("entryGo");
    const unitGrid = el("unitGrid");
    UNITS.forEach((u, i) => {
      const b = document.createElement("button"); b.className = "unitbtn";
      b.innerHTML = '<span class="n">' + (i + 1) + '.</span><span>' + u + '</span>';
      b.addEventListener("click", () => startTopic(u));
      unitGrid.appendChild(b);
    });
    topicInput.addEventListener("input", () => { entryGo.disabled = !topicInput.value.trim(); });
    topicInput.addEventListener("keydown", (e) => { if (e.key === "Enter" && topicInput.value.trim()) startTopic(topicInput.value.trim()); });

    // NOTE 2026-08-07: students TYPE the topic they want to explore (a short phrase like
    // "slope" or "fraction review"); the spoken back-and-forth begins once the topic is in.
    entryGo.addEventListener("click", () => { const tp = (topicInput.value || "").trim(); if (tp) startTopic(tp); });

    async function startTopic(tp) {
      topic = tp;
      el("topicText").textContent = tp; el("topicBar").classList.add("show");
      entry.classList.add("hide");
      ensureAudioGraph(); await warmUpAudio();
      // 2026-08-07: voice restored -- only auto-open the left-rail type box when this browser
      // can't record (the persistent type bar under the board is always there as a fallback).
      if (!canRecord) showComposer();
      busy = true; setPhase("busy");
      const opener = "I'd like to explore: " + tp;
      addBubble("student", opener);
      history.push({ role: "user", content: opener });
      await runTutor(opener);
    }

    function resetToEntry() {
      topic = ""; history = [];
      clearStage();   // reset the transcript feed to its empty hint
      el("topicBar").classList.remove("show"); el("topicText").textContent = "";
      topicInput.value = ""; entryGo.disabled = true; el("entryNote").textContent = "";
      composer.classList.remove("show"); typeToggle.style.display = "";
      setPhase("idle"); statusEl.textContent = "";
      entry.classList.remove("hide"); topicInput.focus();
    }

    // ---------- Load ----------
    async function loadVoice() {
      try { const vs = await fetch("/api/voice-status"); if (vs.ok) elevenEnabled = !!(await vs.json()).eleven; } catch (e) {}
      if (!canRecord) { talkBtn.style.display = "none"; hint.textContent = "Voice recording isn't supported here — type instead."; }
    }
    loadVoice();

    window.__setState = setState;
  </script>
  <script src="/static/math-keyboard.js"></script>
  <script src="/static/graph-input.js"></script>
  <script src="/static/time-tracker.js"></script>
  <script src="/static/help-tips.js"></script>
  <script src="/static/library.js"></script>
  <script src="/static/app-nav.js"></script>
</body>
