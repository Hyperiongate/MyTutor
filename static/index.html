<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Math Tutor</title>
  <style>
    :root {
      --ink:#26263a; --muted:#6b6f82; --line:#e7e6f2; --accent:#5b5bd6; --accent2:#14b8a6;
      --warm:#ff7a59; --panel:#ffffff;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; align-items: center; justify-content: center; padding: 24px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: var(--ink);
      background:
        radial-gradient(760px 500px at 8% -10%, rgba(91,91,214,.18), transparent 60%),
        radial-gradient(760px 480px at 94% -6%, rgba(20,184,166,.16), transparent 55%),
        radial-gradient(760px 520px at 55% 112%, rgba(255,122,89,.14), transparent 55%),
        #f4f4fc;
    }
    .card {
      width: 100%; max-width: 400px; background: var(--panel); border: 1px solid var(--line);
      border-radius: 20px; padding: 34px 32px 30px; box-shadow: 0 16px 44px rgba(20,30,45,.10);
      text-align: center;
    }
    .orb { width: 54px; height: 54px; border-radius: 50%; margin: 0 auto 14px;
      background: radial-gradient(circle at 34% 30%, #a7f3e6 0%, #5b5bd6 62%, #4038b8 100%);
      box-shadow: 0 8px 22px rgba(91,91,214,.35); }
    h1 { font-size: 26px; margin: 0 0 4px; font-weight: 800;
      background: linear-gradient(90deg, var(--accent), var(--accent2)); -webkit-background-clip: text;
      background-clip: text; -webkit-text-fill-color: transparent; }
    p.sub { color: var(--muted); margin: 0 0 26px; font-size: 14.5px; }
    label { display: block; text-align: left; font-size: 13px; color: var(--muted); margin: 0 0 6px; font-weight: 600; }
    input {
      width: 100%; font-size: 20px; letter-spacing: 3px; text-align: center; padding: 13px;
      border: 1px solid var(--line); border-radius: 12px; outline: none; background: #fbfbff;
      transition: border-color .12s ease, box-shadow .12s ease;
    }
    input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(91,91,214,.16); }
    .btn {
      margin-top: 16px; width: 100%; font-size: 16px; font-weight: 700; padding: 13px; border-radius: 12px;
      cursor: pointer; border: none; color: #fff;
      background: linear-gradient(90deg, var(--accent), var(--accent2)); box-shadow: 0 10px 24px rgba(91,91,214,.32);
      transition: transform .12s ease, box-shadow .12s ease;
    }
    .btn:hover { transform: translateY(-1px); box-shadow: 0 14px 30px rgba(91,91,214,.4); }
    .btn:disabled { opacity: .55; cursor: default; transform: none; box-shadow: none; }
    .btn.ghost { background: #fff; color: var(--accent); border: 1px solid var(--accent); box-shadow: none; }
    .btn.ghost:hover { background: #f3f3fc; transform: none; box-shadow: none; }
    .msg { margin-top: 14px; font-size: 13px; min-height: 18px; }
    .msg.error { color: #c0392b; }
    .hint { margin-top: 22px; font-size: 12px; color: var(--muted); line-height: 1.5; }
    .pt { margin-top: 20px; border-top: 1px solid var(--line); padding-top: 16px; }
    .ptlink { font-size: 13px; color: var(--accent); text-decoration: none; font-weight: 700; cursor: pointer; }
    .ptform { margin-top: 14px; text-align: left; }
    /* --- "math paper" background (2026-07-28): soft brand washes + faint drifting math
       symbols + fine graph-paper grid with a heavier line every 5 squares. Pure CSS, no
       images or requests. Declared LAST so it supersedes the page's original background. --- */
    body {
      background-color: #fbfbff;
      background-image:
        radial-gradient(760px 500px at 8% -10%, rgba(91,91,214,.16), transparent 60%),
        radial-gradient(760px 480px at 94% -6%, rgba(20,184,166,.15), transparent 55%),
        radial-gradient(700px 520px at 55% 112%, rgba(255,122,89,.12), transparent 55%),
        url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%22520%22%20height%3D%22520%22%3E%0A%3Cg%20fill%3D%22%235b5bd6%22%20fill-opacity%3D%220.085%22%20font-family%3D%22Georgia%2CCambria%2Cserif%22%3E%0A%3Ctext%20x%3D%2234%22%20y%3D%2282%22%20font-size%3D%2262%22%3E%26%23960%3B%3C/text%3E%0A%3Ctext%20x%3D%22188%22%20y%3D%22140%22%20font-size%3D%2250%22%3E%26%238721%3B%3C/text%3E%0A%3Ctext%20x%3D%22330%22%20y%3D%2272%22%20font-size%3D%2256%22%3E%26%238730%3B%3C/text%3E%0A%3Ctext%20x%3D%22452%22%20y%3D%22132%22%20font-size%3D%2248%22%3E%26%23952%3B%3C/text%3E%0A%3Ctext%20x%3D%2270%22%20y%3D%22238%22%20font-size%3D%2252%22%3E%26%238747%3B%3C/text%3E%0A%3Ctext%20x%3D%22238%22%20y%3D%22286%22%20font-size%3D%2260%22%3E%26%238734%3B%3C/text%3E%0A%3Ctext%20x%3D%22392%22%20y%3D%22242%22%20font-size%3D%2246%22%3E%26%23916%3B%3C/text%3E%0A%3Ctext%20x%3D%2240%22%20y%3D%22392%22%20font-size%3D%2246%22%3Ex%26%23178%3B%3C/text%3E%0A%3Ctext%20x%3D%22176%22%20y%3D%22438%22%20font-size%3D%2250%22%3E%26%238706%3B%3C/text%3E%0A%3Ctext%20x%3D%22318%22%20y%3D%22392%22%20font-size%3D%2244%22%3E%26%238804%3B%3C/text%3E%0A%3Ctext%20x%3D%22440%22%20y%3D%22452%22%20font-size%3D%2252%22%3E%26%238724%3B%3C/text%3E%0A%3Ctext%20x%3D%22112%22%20y%3D%22500%22%20font-size%3D%2244%22%3E%26%238776%3B%3C/text%3E%0A%3C/g%3E%3C/svg%3E"),
        linear-gradient(rgba(91,91,214,.055) 1px, transparent 1px),
        linear-gradient(90deg, rgba(91,91,214,.055) 1px, transparent 1px),
        linear-gradient(rgba(91,91,214,.11) 1px, transparent 1px),
        linear-gradient(90deg, rgba(91,91,214,.11) 1px, transparent 1px);
      background-size:
        auto, auto, auto,
        520px 520px,
        26px 26px, 26px 26px,
        130px 130px, 130px 130px;
      background-repeat: no-repeat, no-repeat, no-repeat, repeat, repeat, repeat, repeat, repeat;
      background-attachment: fixed, fixed, fixed, scroll, scroll, scroll, scroll, scroll;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="orb"></div>
    <h1>Math Tutor</h1>
    <p class="sub">Learn algebra with Mr. Cadabra. Enter your code to begin.</p>

    <label for="code">Student code</label>
    <input id="code" inputmode="numeric" autocomplete="off" placeholder="••••" maxlength="12" />
    <button id="go" class="btn">Start</button>
    <div id="msg" class="msg"></div>

    <div class="hint">
      Test codes for v0.1: 1234 (Alex), 2345 (Maya), 3456 (Sam), 0000 (Demo).
    </div>

    <div class="pt">
      <a id="ptToggle" class="ptlink">👪 Parent or teacher? View a student's progress →</a>
      <div id="ptForm" class="ptform" style="display:none;">
        <label for="ptcode">Student's code</label>
        <input id="ptcode" inputmode="numeric" autocomplete="off" placeholder="••••" maxlength="12" />
        <button id="ptgo" class="btn ghost">View progress</button>
        <div id="ptmsg" class="msg"></div>
        <div style="margin-top:14px; font-size:13px;">
          Following a whole class? <a href="/teacher" style="color:var(--accent); font-weight:700;">Open your class dashboard →</a>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ------------------------------------------------------------------
    // Login logic: validate the code with the backend; on success move to
    // the HOME HUB (placement is no longer forced at login). The Parent/
    // Teacher entry sends a code straight to the read-only dashboard.
    // ------------------------------------------------------------------
    const input = document.getElementById("code");
    const button = document.getElementById("go");
    const msg = document.getElementById("msg");

    function setMsg(text, isError) {
      msg.textContent = text || "";
      msg.className = "msg" + (isError ? " error" : "");
    }

    async function login() {
      const code = (input.value || "").trim();
      if (!code) { setMsg("Please enter your code.", true); return; }
      button.disabled = true;
      setMsg("Checking…", false);
      try {
        const res = await fetch("/api/login", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ code })
        });
        if (!res.ok) {
          setMsg("That code was not recognized. Please try again.", true);
          button.disabled = false; return;
        }
        setMsg("Welcome!", false);
        window.location.href = "/home?code=" + encodeURIComponent(code);
      } catch (err) {
        setMsg("Something went wrong. Please try again.", true);
        button.disabled = false;
      }
    }

    button.addEventListener("click", login);
    input.addEventListener("keydown", (e) => { if (e.key === "Enter") login(); });

    // Parent/Teacher: view a student's progress read-only (no lesson, no separate password
    // in dev -- a homeschool parent uses their child's code).
    const ptToggle = document.getElementById("ptToggle");
    const ptForm = document.getElementById("ptForm");
    const ptcode = document.getElementById("ptcode");
    const ptgo = document.getElementById("ptgo");
    const ptmsg = document.getElementById("ptmsg");
    ptToggle.addEventListener("click", () => {
      ptForm.style.display = (ptForm.style.display === "none" ? "block" : "none");
      if (ptForm.style.display === "block") ptcode.focus();
    });
    async function viewProgress() {
      const code = (ptcode.value || "").trim();
      if (!code) { ptmsg.textContent = "Enter the student's code."; ptmsg.className = "msg error"; return; }
      ptgo.disabled = true; ptmsg.textContent = "Checking…"; ptmsg.className = "msg";
      try {
        const res = await fetch("/api/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ code }) });
        if (!res.ok) { ptmsg.textContent = "That code wasn't recognized."; ptmsg.className = "msg error"; ptgo.disabled = false; return; }
        window.location.href = "/dashboard?code=" + encodeURIComponent(code) + "&view=teacher";
      } catch (err) { ptmsg.textContent = "Something went wrong."; ptmsg.className = "msg error"; ptgo.disabled = false; }
    }
    ptgo.addEventListener("click", viewProgress);
    ptcode.addEventListener("keydown", (e) => { if (e.key === "Enter") viewProgress(); });

    input.focus();
  </script>
</body>
</html>
