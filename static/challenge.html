<!DOCTYPE html>
<!--
  =============================================================================
  challenge.html  --  Math Tutor MVP  --  Hyperion Shift LLC
  -----------------------------------------------------------------------------
  CHANGE NOTES (keep newest at top):
    2026-07-28  ADDED ALGEBRA II placement bank. New ALG2_BANK (9 climbing tiers, 2 questions each,
                every answer solved & verified), ALG2_UNIT_NAMES, ALG2_TIER_SKILL, ALG2_LEVELS, and an
                algebra2 entry in COURSE_DATA. Purely additive; the engine already reads ?course= and
                falls back to Algebra I, so a first-time Algebra II student now takes an Algebra II
                placement, stored per course. Do no harm.
    2026-07-28  MULTI-COURSE PLACEMENT (Phase 3.4b). The Challenge is now course-aware: it reads
                ?course= and picks that course's question bank + unit names + tier skills + level
                titles (ALG_* unchanged; new GEO_* Geometry bank of 9 tiers). All result links and
                the placement POST now carry &course=, and the placement is saved PER COURSE
                (/api/placement/{code}?course=). The result speech names the subject. So a student
                entering Geometry for the first time takes a GEOMETRY placement, stored separately
                from Algebra. The game engine + IDs are unchanged. Algebra placement is identical.
    2026-07-24  PHASE E VISUAL POLISH. Brought the challenge screen fully onto the app's
                design system so it matches the login/hub/dashboard: primary buttons now
                have the same hover-lift + disabled behavior as the rest of the app, the
                ghost button is now white-with-accent-border (was a flat #eef), the START
                and RESULT panel titles now use the brand purple->teal gradient, and the
                answer choices + buttons no longer show a blue mobile tap-highlight or let
                a double-tap select their text. Also removed a duplicate "display:none" on
                the quiz container (cosmetic; behavior unchanged). No game logic, IDs, or
                the placement POST were touched.
    2026-07-21  Placement is now reached via the hub's "Start my Algebra course" tile
                (only when unplaced). So "Start learning" after the quiz goes INTO the
                course (/session); Exit (bailing mid-quiz) goes back to the hub (/home).
    2026-07-21  READABILITY FIX. Questions were one cramped line like
                "Solve: x + 5 = 12.  x = ?", where the sentence period after 12 ran
                into the "x" and looked like the decimal "12.x". Each question is now
                two SEPARATE lines: a small plain-words instruction (e.g. "Solve for
                x") above, and the equation itself shown BIG on its own line below.
                The trailing "x = ?" is gone (the four choices already ARE the x
                values). Bank entries changed from {q} to {p, e}; render + CSS updated.
    2026-07-19  Initial "Mr. Cadabra's Challenge": an adaptive, game-show-style
                placement quiz. Mr. Cadabra (orb + voice) hosts; the student taps
                answers; difficulty climbs and gives a second chance at a tier
                before stopping. Points + streak HUD. Ends in a fun result that
                names a level and the unit to start in, and posts the placement to
                /api/placement/{code} (so the tutor and dashboard can use it).
                Reusable engine (same bank can drive topic quizzes later).
  =============================================================================
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mr. Cadabra's Challenge</title>
  <style>
    :root { --ink:#26263a; --muted:#6b6f82; --line:#e7e6f2; --accent:#5b5bd6; --accent2:#14b8a6;
      --warm:#ff7a59; --good:#16a34a; --bad:#e5484d; --panel:#ffffff; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--ink); min-height: 100vh; display: flex; flex-direction: column;
      background:
        radial-gradient(760px 500px at 8% -10%, rgba(91,91,214,.20), transparent 60%),
        radial-gradient(760px 480px at 94% -6%, rgba(20,184,166,.18), transparent 55%),
        radial-gradient(760px 520px at 55% 112%, rgba(255,122,89,.16), transparent 55%),
        #f4f4fc; }
    .top { display: flex; align-items: center; padding: 14px 22px; }
    .top .title { font-weight: 800; font-size: 17px;
      background: linear-gradient(90deg, var(--accent), var(--accent2)); -webkit-background-clip: text;
      background-clip: text; -webkit-text-fill-color: transparent; }
    .top .spacer { flex: 1; }
    .top a { font-size: 13px; color: var(--muted); text-decoration: none; }

    .wrap { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 10px 20px 30px; width: 100%; max-width: 720px; margin: 0 auto; }

    /* HUD */
    .hud { display: flex; gap: 10px; align-items: center; width: 100%; max-width: 560px; margin-bottom: 12px; }
    .hud .chip { background: #fff; border: 1px solid var(--line); border-radius: 20px; padding: 6px 13px;
      font-size: 13px; font-weight: 700; box-shadow: 0 4px 12px rgba(20,30,45,.05); }
    .hud .chip.pts { color: var(--accent); } .hud .chip.streak { color: var(--warm); }
    .hud .spacer { flex: 1; }
    .hud .prog { font-size: 12px; color: var(--muted); font-weight: 600; }

    /* Host */
    .host { display: flex; align-items: center; gap: 14px; width: 100%; max-width: 560px; margin-bottom: 10px; }
    .orbwrap { width: 72px; height: 72px; flex: 0 0 auto; }
    .orbwrap canvas { width: 100%; height: 100%; display: block; }
    .host .say { font-size: 16px; font-weight: 600; min-height: 22px; }

    /* Card */
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 20px; width: 100%;
      max-width: 560px; padding: 24px; box-shadow: 0 16px 44px rgba(20,30,45,.10); }
    /* Question is shown in TWO parts on SEPARATE lines: a small words instruction
       (qprompt) above, and the math itself (qexpr) big below. Keeping them apart
       means a trailing period after a number can never look like a decimal joining
       the next letter (the old "= 12.  x = ?" read as "12.x"). */
    .qprompt { font-size: 15px; font-weight: 700; color: var(--muted); text-align: center;
      margin: 2px 0 8px; letter-spacing: .01em; }
    .qexpr { font-size: 30px; font-weight: 800; text-align: center; margin: 0 0 22px; line-height: 1.25;
      letter-spacing: .04em; font-variant-numeric: tabular-nums; }
    .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .choice { border: 2px solid var(--line); border-radius: 14px; padding: 16px; font-size: 19px; font-weight: 700;
      background: #fbfbff; cursor: pointer; text-align: center; transition: transform .08s ease, border-color .15s ease;
      user-select: none; -webkit-tap-highlight-color: transparent; }
    .choice:hover { border-color: var(--accent); }
    .choice:active { transform: scale(.97); }
    .choice.correct { border-color: var(--good); background: #e9f9ef; color: var(--good); }
    .choice.wrong { border-color: var(--bad); background: #fdeced; color: var(--bad); }
    .choice.dim { opacity: .5; }

    /* Buttons */
    .btn { border: none; border-radius: 30px; cursor: pointer; color: #fff; font-size: 17px; font-weight: 800;
      padding: 15px 30px; background: linear-gradient(90deg, var(--accent), var(--accent2));
      box-shadow: 0 10px 24px rgba(91,91,214,.38);
      transition: transform .12s ease, box-shadow .12s ease;
      user-select: none; -webkit-tap-highlight-color: transparent; }
    .btn:hover { transform: translateY(-1px); box-shadow: 0 14px 30px rgba(91,91,214,.46); }
    .btn:active { transform: translateY(0) scale(.98); }
    .btn:disabled { opacity: .55; cursor: default; transform: none; box-shadow: none; }
    .btn.ghost { background: #fff; color: var(--accent); border: 1px solid var(--accent); box-shadow: none; }
    .btn.ghost:hover { background: #f3f3fc; transform: none; box-shadow: none; }

    /* Start / result panels */
    .panel { background: var(--panel); border-radius: 22px; width: 100%; max-width: 560px; padding: 30px;
      box-shadow: 0 18px 50px rgba(20,30,45,.14); text-align: center; }
    .panel .badge { width: 84px; height: 84px; margin: 0 auto 8px; border-radius: 50%; font-size: 40px;
      display: flex; align-items: center; justify-content: center;
      background: radial-gradient(circle at 34% 30%, #b8a8ff, var(--accent) 72%);
      box-shadow: 0 10px 26px rgba(91,91,214,.45); }
    .panel h1 { font-size: 26px; margin: 6px 0 4px; font-weight: 800;
      background: linear-gradient(90deg, var(--accent), var(--accent2)); -webkit-background-clip: text;
      background-clip: text; -webkit-text-fill-color: transparent; }
    .panel p { color: var(--muted); font-size: 15px; margin: 0 0 8px; }
    .level-badge { display: inline-flex; align-items: center; gap: 10px; margin: 12px auto; padding: 12px 20px;
      border-radius: 16px; background: linear-gradient(135deg, rgba(91,91,214,.12), rgba(20,184,166,.12));
      border: 1px solid var(--line); }
    .level-badge .lvl { width: 48px; height: 48px; border-radius: 12px; color: #fff; font-weight: 800; font-size: 20px;
      display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, var(--accent), var(--accent2)); }
    .level-badge .lt { text-align: left; display: flex; flex-direction: column; line-height: 1.25; }
    .level-badge .lt b { font-size: 18px; } .level-badge .lt span { font-size: 12px; color: var(--muted); }
    .startu { margin: 8px 0 4px; font-size: 16px; }
    .startu b { color: var(--accent); }
    .strengths { list-style: none; padding: 0; margin: 14px 0; text-align: left; }
    .strengths li { font-size: 14px; padding: 7px 10px; border-radius: 9px; margin-bottom: 5px; background: #f4f8f5; }
    .strengths li .ck { color: var(--good); font-weight: 800; margin-right: 8px; }
    .result-btns { display: flex; gap: 10px; justify-content: center; margin-top: 8px; flex-wrap: wrap; }
  </style>
</head>
<body>
  <div class="top">
    <div class="title">🎯 Mr. Cadabra's Challenge</div>
    <div class="spacer"></div>
    <a id="exitLink" href="/">Exit</a>
  </div>

  <div class="wrap">
    <!-- START -->
    <div class="panel" id="startPanel">
      <div class="badge">🎩</div>
      <h1>Let's find your level!</h1>
      <p>A few quick questions — they get trickier as you go. Just tap your answer. Ready?</p>
      <button class="btn" id="beginBtn" style="margin-top:12px;">Start the challenge →</button>
    </div>

    <!-- QUIZ (hidden until start) -->
    <div id="quiz" style="display:none; width:100%; flex-direction:column; align-items:center;">
      <div class="hud">
        <div class="chip pts">⭐ <span id="pts">0</span></div>
        <div class="chip streak">🔥 <span id="streak">0</span></div>
        <div class="spacer"></div>
        <div class="prog" id="prog">Question 1</div>
      </div>
      <div class="host">
        <div class="orbwrap"><canvas id="orb" width="220" height="220"></canvas></div>
        <div class="say" id="say">Here we go!</div>
      </div>
      <div class="card">
        <div class="qprompt" id="qprompt"></div>
        <div class="qexpr" id="qexpr">…</div>
        <div class="choices" id="choices"></div>
      </div>
    </div>

    <!-- RESULT (hidden until finish) -->
    <div class="panel" id="resultPanel" style="display:none;">
      <div class="badge" id="rBadge">✨</div>
      <h1 id="rTitle">Nice work!</h1>
      <p id="rSub">Here's where you are.</p>
      <div class="level-badge">
        <div class="lvl" id="rLvl">1</div>
        <div class="lt"><b id="rLvlTitle">—</b><span id="rPts">0 points</span></div>
      </div>
      <div class="startu">Let's start you at <b id="rStartUnit">Unit 1</b>.</div>
      <ul class="strengths" id="rStrengths"></ul>
      <div class="result-btns">
        <button class="btn" id="goLearn">Start learning with Mr. Cadabra →</button>
        <button class="btn ghost" id="goDash">See my dashboard</button>
      </div>
    </div>
  </div>

  <script>
    const el = (id) => document.getElementById(id);
    const params = new URLSearchParams(location.search);
    const CODE = (params.get("code") || "").trim();
    if (!CODE) location.href = "/";
    const COURSE = (params.get("course") || "algebra1").trim();  // which course we're placing for
    const cq = "?code=" + encodeURIComponent(CODE) + "&course=" + encodeURIComponent(COURSE);
    el("exitLink").href = CODE ? ("/home" + cq) : "/";
    // After placing, "Start learning" goes INTO the course (the student chose to start
    // it; placement was the gate). Exit (bailing mid-quiz) goes back to the hub.
    el("goLearn").onclick = () => location.href = "/session" + cq;
    el("goDash").onclick = () => location.href = "/dashboard" + cq;

    // ---- Per-course question banks: 9 tiers (climbing difficulty), 2 questions each ----
    // Tier N roughly maps to that course's Unit N. answer = index of correct choice.
    // Each question has two shown parts: p = plain-words instruction (small, on top)
    // and e = the math itself (big, on its own line). c = choices, a = index of the
    // correct one. Keeping the instruction and the equation on SEPARATE lines is what
    // fixes the old "= 12.  x = ?" reading as the decimal "12.x".
    const ALG_BANK = {
      1: [ {p:"Work it out", e:"7 − 10", c:["3","−3","−17","17"], a:1},
           {p:"Work it out", e:"3 + 2 × 4", c:["20","11","14","24"], a:1} ],
      2: [ {p:"Solve for x", e:"x + 5 = 12", c:["7","17","5","60"], a:0},
           {p:"Solve for x", e:"2x = 14", c:["7","12","28","16"], a:0} ],
      3: [ {p:"Solve for x", e:"2x + 3 = 11", c:["4","7","5","8"], a:0},
           {p:"Solve for x", e:"5x − 4 = 3x + 2", c:["3","1","6","−3"], a:0} ],
      4: [ {p:"Find f(3) when", e:"f(x) = 2x + 1", c:["7","6","5","9"], a:0},
           {p:"Find g(4) when", e:"g(x) = x² − 1", c:["15","7","16","8"], a:0} ],
      5: [ {p:"Find the slope", e:"y = 3x − 2", c:["3","−2","2","⅓"], a:0},
           {p:"Find the slope of the line through", e:"(0, 1) and (2, 5)", c:["2","3","4","1"], a:0} ],
      6: [ {p:"Where do these lines cross?", e:"y = x   and   y = 4", c:["(4, 4)","(0, 4)","(4, 0)","(2, 2)"], a:0},
           {p:"Solve the system for x", e:"y = 2x   and   x + y = 6", c:["2","3","6","4"], a:0} ],
      7: [ {p:"Simplify", e:"x³ · x²", c:["x⁵","x⁶","x¹","2x⁵"], a:0},
           {p:"Work it out", e:"2⁻²", c:["¼","−4","4","½"], a:0} ],
      8: [ {p:"Factor", e:"x² − 9", c:["(x−3)(x+3)","(x−9)(x+1)","(x−3)²","(x+9)(x−1)"], a:0},
           {p:"Expand", e:"(x + 2)(x + 3)", c:["x² + 5x + 6","x² + 6x + 5","x² + 6","x² + 5x + 5"], a:0} ],
      9: [ {p:"Solve for x", e:"x² = 25", c:["±5","5","25","±25"], a:0},
           {p:"Find the solutions", e:"(x − 2)(x + 3) = 0", c:["2 and −3","−2 and 3","2 and 3","−2 and −3"], a:0} ],
    };
    const GEO_BANK = {
      1: [ {p:"Find the complement", e:"complement of 30°", c:["60°","70°","150°","30°"], a:0},
           {p:"Find the supplement", e:"supplement of 110°", c:["70°","90°","110°","250°"], a:0} ],
      2: [ {p:"Reflect over the x-axis", e:"the point (3, 5)", c:["(3, −5)","(−3, 5)","(−3, −5)","(5, 3)"], a:0},
           {p:"How many lines of symmetry?", e:"a square", c:["4","2","1","8"], a:0} ],
      3: [ {p:"Which rule proves them congruent?", e:"three pairs of equal sides", c:["SSS","AAA","SSA","none"], a:0},
           {p:"Does this prove congruence?", e:"AAA (all three angles equal)", c:["No — only similar","Yes, always","Yes, by ASA","Only right triangles"], a:0} ],
      4: [ {p:"Similar triangles, scale factor 3", e:"a side of 4 becomes…", c:["12","7","1.33","64"], a:0},
           {p:"If the sides scale by 2,", e:"the area scales by…", c:["4","2","8","½"], a:0} ],
      5: [ {p:"Find the hypotenuse", e:"legs 3 and 4", c:["5","7","12","25"], a:0},
           {p:"Find the missing leg", e:"leg 6, hypotenuse 10", c:["8","4","16","2"], a:0} ],
      6: [ {p:"Find the inscribed angle", e:"it intercepts an 80° arc", c:["40°","80°","160°","20°"], a:0},
           {p:"A tangent meets the radius at", e:"an angle of…", c:["90°","45°","180°","60°"], a:0} ],
      7: [ {p:"Find the distance", e:"(0, 0) to (3, 4)", c:["5","7","√7","25"], a:0},
           {p:"Find the midpoint", e:"(2, 4) and (6, 8)", c:["(4, 6)","(8, 12)","(2, 2)","(4, 4)"], a:0} ],
      8: [ {p:"Area of a circle, radius 3", e:"A = ?", c:["9π","6π","3π","9"], a:0},
           {p:"Volume of a cube, side 4", e:"V = ?", c:["64","16","12","48"], a:0} ],
      9: [ {p:"Probability of rolling a 4", e:"on a fair die", c:["1/6","1/4","4/6","1/2"], a:0},
           {p:"Two coins — both heads", e:"P = ?", c:["1/4","1/2","1/3","3/4"], a:0} ],
    };
    const ALG_UNIT_NAMES = { 1:"Foundations & Expressions", 2:"Linear Equations & Inequalities",
      3:"Functions & Notation", 4:"Linear Functions & Graphs", 5:"Systems of Equations",
      6:"Exponents & Exponential Functions", 7:"Polynomials & Factoring", 8:"Quadratic Functions", 9:"Data & Statistics" };
    const GEO_UNIT_NAMES = { 1:"Foundations & Constructions", 2:"Transformations & Symmetry",
      3:"Congruence & Triangle Proofs", 4:"Similarity & Dilations", 5:"Right Triangles & Trigonometry",
      6:"Circles", 7:"Coordinate Geometry", 8:"Area, Surface Area & Volume", 9:"Probability" };
    const ALG_TIER_SKILL = { 1:"Number sense", 2:"Solving equations", 3:"Multi-step solving", 4:"Functions",
      5:"Slope & graphs", 6:"Systems", 7:"Exponents", 8:"Factoring", 9:"Quadratics" };
    const GEO_TIER_SKILL = { 1:"Angles & basics", 2:"Transformations", 3:"Congruence & proof", 4:"Similarity",
      5:"Right triangles & trig", 6:"Circles", 7:"Coordinate geometry", 8:"Area & volume", 9:"Probability" };
    const ALG_LEVELS = ["Getting Started","Equation Rookie","Equation Solver","Function Finder","Graph Explorer",
      "Systems Thinker","Power Player","Factoring Pro","Quadratic Whiz","Algebra Ace"];
    const GEO_LEVELS = ["Getting Started","Angle Apprentice","Transformation Traveler","Proof Pupil","Similarity Scout",
      "Right-Triangle Ranger","Circle Sage","Coordinate Captain","Volume Virtuoso","Geometry Ace"];

    const PREALG_BANK = {
      1: [ {p:"Work it out", e:"3 + 2 × 4", c:["20","11","14","24"], a:1},
           {p:"Work it out", e:"12 − 4 ÷ 2", c:["10","4","8","2"], a:0} ],
      2: [ {p:"Find the GCF", e:"12 and 18", c:["6","2","3","36"], a:0},
           {p:"Which one is prime?", e:"9, 15, 17, 21", c:["17","9","15","21"], a:0} ],
      3: [ {p:"Work it out", e:"−4 + 9", c:["5","−5","13","−13"], a:0},
           {p:"Work it out", e:"−6 − (−2)", c:["−4","−8","4","8"], a:0} ],
      4: [ {p:"Add", e:"1/2 + 1/3", c:["5/6","2/5","1/6","2/6"], a:0},
           {p:"Multiply", e:"3/4 × 2/3", c:["1/2","6/7","5/7","2/3"], a:0} ],
      5: [ {p:"Which is larger?", e:"0.5 or 0.45", c:["0.5","0.45","they're equal","can't tell"], a:0},
           {p:"Multiply", e:"0.6 × 0.3", c:["0.18","1.8","0.9","0.018"], a:0} ],
      6: [ {p:"Find the unit rate", e:"$12 for 3 pounds", c:["$4 per lb","$3 per lb","$9 per lb","$36 per lb"], a:0},
           {p:"Solve the proportion", e:"2/3 = x/12", c:["8","6","4","18"], a:0} ],
      7: [ {p:"Find it", e:"20% of 80", c:["16","20","40","4"], a:0},
           {p:"Find it", e:"15% of 40", c:["6","4","15","10"], a:0} ],
      8: [ {p:"Area of a rectangle", e:"4 by 6", c:["24","20","10","12"], a:0},
           {p:"Find the mean (average)", e:"4, 8, 6", c:["6","8","18","4"], a:0} ],
      9: [ {p:"Evaluate 2x + 1 when", e:"x = 3", c:["7","6","5","9"], a:0},
           {p:"Solve", e:"x + 5 = 12", c:["7","17","5","60"], a:0} ],
    };
    const PREALG_UNIT_NAMES = { 1:"Number Sense & Order of Operations", 2:"Factors, Multiples & Primes",
      3:"Integers & Negative Numbers", 4:"Fractions", 5:"Decimals", 6:"Ratios, Rates & Proportions",
      7:"Percents", 8:"Measurement & Geometry Basics", 9:"Variables & Expressions" };
    const PREALG_TIER_SKILL = { 1:"Order of operations", 2:"Factors & primes", 3:"Integers", 4:"Fractions",
      5:"Decimals", 6:"Ratios & proportions", 7:"Percents", 8:"Measurement", 9:"Variables" };
    const PREALG_LEVELS = ["Getting Started","Number Novice","Factor Finder","Integer Insider","Fraction Fixer",
      "Decimal Dynamo","Ratio Ranger","Percent Pro","Measurement Master","Pre-Algebra Ace"];

    const ALG2_BANK = {
      1: [ {p:"Solve for x", e:"3(x − 2) = 2x + 5", c:["11","−1","1","5"], a:0},
           {p:"Solve the system for x", e:"y = x   and   x + y = 8", c:["8","4","2","6"], a:1} ],
      2: [ {p:"Solve", e:"x² + 5x + 6 = 0", c:["2 and 3","−1 and −6","−2 and −3","1 and 6"], a:2},
           {p:"Simplify", e:"√(−9)", c:["−3","−9","3i","9i"], a:2} ],
      3: [ {p:"Expand", e:"(x + 2)(x + 3)", c:["x² + 6x + 5","x² + 5x + 6","x² + 6","x² + 5x + 5"], a:1},
           {p:"Factor", e:"x³ − 8", c:["(x − 2)³","(x − 2)(x² + 2x + 4)","(x − 2)(x² − 2x + 4)","(x + 2)(x² − 2x + 4)"], a:1} ],
      4: [ {p:"Simplify", e:"(x² − 4)/(x + 2)", c:["x + 2","x − 4","x − 2","2"], a:2},
           {p:"Which x is not allowed?", e:"1/(x − 3)", c:["−3","0","3","1/3"], a:2} ],
      5: [ {p:"Evaluate", e:"27^(2/3)", c:["6","3","18","9"], a:3},
           {p:"Simplify", e:"√50", c:["5√2","2√5","25√2","10√5"], a:0} ],
      6: [ {p:"Evaluate", e:"log₂ 8", c:["2","4","3","8"], a:2},
           {p:"Solve for x", e:"2^x = 16", c:["4","8","2","5"], a:0} ],
      7: [ {p:"Find the next term", e:"3, 7, 11, 15, …", c:["18","20","19","23"], a:2},
           {p:"Find the common ratio", e:"2, 6, 18, 54", c:["2","4","6","3"], a:3} ],
      8: [ {p:"Convert to radians", e:"180°", c:["π/2","2π","π","π/3"], a:2},
           {p:"Find the value", e:"sin 30°", c:["√3/2","1","1/2","√2/2"], a:2} ],
      9: [ {p:"In a normal distribution, how much is within 1 SD of the mean?", e:"about ___ %", c:["95%","50%","68%","99.7%"], a:2},
           {p:"Find the mean (average)", e:"4, 8, 6, 10, 2", c:["30","5","8","6"], a:3} ],
    };
    const ALG2_UNIT_NAMES = { 1:"Foundations & Systems", 2:"Quadratic Functions & Complex Numbers",
      3:"Polynomial Functions", 4:"Rational Expressions & Functions", 5:"Radicals & Rational Exponents",
      6:"Exponential & Logarithmic Functions", 7:"Sequences & Series", 8:"Trigonometric Functions",
      9:"Statistics & Probability" };
    const ALG2_TIER_SKILL = { 1:"Equations & systems", 2:"Quadratics & complex", 3:"Polynomials",
      4:"Rational functions", 5:"Radicals & exponents", 6:"Exponentials & logs", 7:"Sequences & series",
      8:"Trigonometry", 9:"Statistics" };
    const ALG2_LEVELS = ["Getting Started","Systems Solver","Quadratic Conqueror","Polynomial Pro","Rational Navigator",
      "Radical Ranger","Logarithm Legend","Sequence Sage","Trig Trailblazer","Algebra II Ace"];

    // Select the bank/labels for the course being placed (defaults to Algebra I).
    const COURSE_DATA = {
      algebra1:   { bank: ALG_BANK,    unitNames: ALG_UNIT_NAMES,    tierSkill: ALG_TIER_SKILL,    levels: ALG_LEVELS,    subject: "algebra" },
      geometry:   { bank: GEO_BANK,    unitNames: GEO_UNIT_NAMES,    tierSkill: GEO_TIER_SKILL,    levels: GEO_LEVELS,    subject: "geometry" },
      prealgebra: { bank: PREALG_BANK, unitNames: PREALG_UNIT_NAMES, tierSkill: PREALG_TIER_SKILL, levels: PREALG_LEVELS, subject: "pre-algebra" },
      algebra2:   { bank: ALG2_BANK,   unitNames: ALG2_UNIT_NAMES,   tierSkill: ALG2_TIER_SKILL,   levels: ALG2_LEVELS,   subject: "Algebra II" },
    };
    const CD = COURSE_DATA[COURSE] || COURSE_DATA.algebra1;
    const SUBJECT = CD.subject;
    const BANK = CD.bank;
    const MAX_TIER = 9;
    const UNIT_NAMES = CD.unitNames;
    const TIER_SKILL = CD.tierSkill;
    const LEVELS = CD.levels;

    // ---- State ----
    let tier = 1, second = false, points = 0, streak = 0, asked = 0, highestPassed = 0;
    let locked = false;
    const passedTiers = [];

    // ---- Orb (reused, simplified) ----
    const orb = el("orb"), octx = orb.getContext("2d");
    let t = 0, smooth = 0, hue = 210, orbState = "idle";
    function orbLevel() {
      if (orbState === "happy") return 0.7 + 0.2 * Math.abs(Math.sin(t * 0.08));
      if (orbState === "think") return 0.3 + 0.15 * Math.sin(t * 0.1);
      return 0.12 + 0.05 * Math.sin(t * 0.04);
    }
    function drawOrb() {
      const w = orb.width, h = orb.height, cx = w/2, cy = h/2;
      octx.clearRect(0,0,w,h);
      const lv = orbLevel(); smooth += (lv - smooth) * 0.2; hue += 0.2 + smooth * 0.8;
      const h1 = hue % 360, h2 = (hue + 55) % 360, baseR = w * 0.26, R = baseR * (1 + smooth * 0.3);
      const aura = octx.createRadialGradient(cx,cy,R*0.4,cx,cy,R*2.1);
      aura.addColorStop(0, `hsla(${h1},90%,62%,${0.28+smooth*0.3})`); aura.addColorStop(1, `hsla(${h1},90%,62%,0)`);
      octx.fillStyle = aura; octx.beginPath(); octx.arc(cx,cy,R*2.1,0,7); octx.fill();
      octx.save(); octx.shadowColor = `hsla(${h2},95%,60%,.8)`; octx.shadowBlur = 26 + smooth*34;
      octx.beginPath();
      for (let i=0;i<=60;i++){ const a=(i/60)*Math.PI*2;
        const wob = 1 + (0.05+smooth*0.09)*Math.sin(a*3+t*0.06) + (smooth*0.05)*Math.sin(a*5-t*0.05);
        const rr=R*wob, x=cx+Math.cos(a)*rr, y=cy+Math.sin(a)*rr; i?octx.lineTo(x,y):octx.moveTo(x,y); }
      octx.closePath();
      const body = octx.createRadialGradient(cx-R*0.3,cy-R*0.35,R*0.1,cx,cy,R*1.15);
      body.addColorStop(0,`hsla(${h1},100%,88%,1)`); body.addColorStop(0.45,`hsla(${h1},95%,64%,1)`); body.addColorStop(1,`hsla(${h2},90%,45%,1)`);
      octx.fillStyle = body; octx.fill(); octx.restore();
      octx.beginPath(); octx.arc(cx-R*0.28,cy-R*0.32,R*0.3,0,7); octx.fillStyle="rgba(255,255,255,.55)"; octx.fill();
      t += 1; requestAnimationFrame(drawOrb);
    }
    drawOrb();

    // ---- Voice (optional; streams if ElevenLabs configured, else browser) ----
    const ttsAudio = new Audio(); let elevenOn = false, maleVoice = null;
    function pickVoice(){ const v = window.speechSynthesis ? speechSynthesis.getVoices() : []; if(!v.length) return;
      const en = v.filter(x => /en/i.test(x.lang)); maleVoice = en.find(x => /david|daniel|alex|male|fred/i.test(x.name)) || en[0] || v[0]; }
    if (window.speechSynthesis){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
    function say(text, spoken) {
      el("say").textContent = text;
      const line = spoken || text;
      if (elevenOn) { try { ttsAudio.pause(); } catch(e){} ttsAudio.src = "/api/speak?text=" + encodeURIComponent(line);
        const p = ttsAudio.play(); if (p && p.catch) p.catch(()=>browserSay(line)); }
      else browserSay(line);
    }
    function browserSay(line){ if(!window.speechSynthesis) return; try { speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(line); if(maleVoice) u.voice=maleVoice; u.rate=1.02; u.pitch=0.95; speechSynthesis.speak(u);}catch(e){} }

    // ---- Flow ----
    async function begin() {
      try { const vs = await fetch("/api/voice-status"); if (vs.ok) elevenOn = !!(await vs.json()).eleven; } catch(e){}
      el("startPanel").style.display = "none";
      el("quiz").style.display = "flex";
      say("Alright — let's find your level. Here we go!", "Alright! Let's find your level. Here we go!");
      setTimeout(nextQuestion, 700);
    }
    el("beginBtn").onclick = begin;

    function nextQuestion() {
      if (tier > MAX_TIER) return finish();
      locked = false; orbState = "think";
      const q = BANK[tier][second ? 1 : 0];
      asked++;
      el("prog").textContent = "Question " + asked;
      el("qprompt").textContent = q.p;
      el("qexpr").textContent = q.e;
      const box = el("choices"); box.innerHTML = "";
      q.c.forEach((choice, i) => {
        const d = document.createElement("div"); d.className = "choice"; d.textContent = choice;
        d.onclick = () => answer(i, q, d); box.appendChild(d);
      });
    }

    function answer(i, q, node) {
      if (locked) return; locked = true;
      const correct = (i === q.a);
      const nodes = el("choices").children;
      for (const n of nodes) n.classList.add("dim");
      node.classList.remove("dim");
      if (correct) {
        node.classList.add("correct");
        const gain = 100 + streak * 20; points += gain; streak++;
        highestPassed = tier; if (!passedTiers.includes(tier)) passedTiers.push(tier);
        orbState = "happy";
        say(pick(["Yes! 🎉","Nailed it!","Boom — correct!","Exactly right!"]), pick(["Yes!","Nailed it!","Correct!","Exactly right!"]));
        el("pts").textContent = points; el("streak").textContent = streak;
        second = false; tier++;
        setTimeout(nextQuestion, 1100);
      } else {
        node.classList.add("wrong");
        // reveal correct
        for (let k=0;k<nodes.length;k++) if (k === q.a) nodes[k].classList.add("correct");
        streak = 0; el("streak").textContent = 0; orbState = "idle";
        if (!second) { say("Ooh, not quite — one more at this level.", "Not quite. One more at this level.");
          second = true; setTimeout(nextQuestion, 1300); }
        else { say("No worries — that's a perfect place to start!", "No worries. That's a perfect place to start.");
          setTimeout(finish, 1300); }
      }
    }
    function pick(arr){ return arr[asked % arr.length]; }

    function finish() {
      const startUnit = Math.min(highestPassed + 1, 9);
      const lvlIdx = highestPassed;            // 0..9
      const lvlTitle = LEVELS[lvlIdx];
      el("quiz").style.display = "none";
      const rp = el("resultPanel"); rp.style.display = "block";
      el("rBadge").textContent = highestPassed >= 6 ? "🏆" : (highestPassed >= 3 ? "🌟" : "🚀");
      el("rTitle").textContent = highestPassed >= 6 ? "Impressive!" : (highestPassed >= 3 ? "Great job!" : "Nice start!");
      el("rSub").textContent = "Here's where you are — and where we'll begin.";
      el("rLvl").textContent = Math.max(1, lvlIdx);
      el("rLvlTitle").textContent = lvlTitle;
      el("rPts").textContent = points + " points";
      el("rStartUnit").textContent = "Unit " + startUnit + ": " + UNIT_NAMES[startUnit];
      const ul = el("rStrengths"); ul.innerHTML = "";
      if (passedTiers.length) {
        passedTiers.sort((a,b)=>a-b).forEach(tr => { const li=document.createElement("li");
          li.innerHTML = '<span class="ck">✓</span>' + TIER_SKILL[tr]; ul.appendChild(li); });
      } else {
        const li=document.createElement("li"); li.textContent = "We'll build your foundation together — a perfect place to start."; ul.appendChild(li);
      }
      say("Awesome — you're a " + lvlTitle + "! We'll start you at Unit " + startUnit + ". Let's go learn some " + SUBJECT + "!",
          "Awesome! You're a " + lvlTitle + ". We'll start you at unit " + startUnit + ". Let's go learn some " + SUBJECT + "!");
      // Save placement so the tutor and dashboard can use it.
      try {
        fetch("/api/placement/" + encodeURIComponent(CODE) + "?course=" + encodeURIComponent(COURSE), {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ level: Math.max(1, lvlIdx), level_title: lvlTitle,
            start_unit: startUnit, start_unit_name: UNIT_NAMES[startUnit],
            points: points, highest_tier: highestPassed, strengths: passedTiers.map(tr => TIER_SKILL[tr]) })
        });
      } catch (e) {}
    }
  </script>
</body>
