     canvas is drawn with its own persona's palette, and the presence layer -- Mr.

<!-- THE VOICE LAYER. voice.js owns the audio graph, the keep-alive and the browser
     fallback. This page satisfies its ambient contract (CODE / forSpeech / setState)
     and otherwise stays out of the way.
     ⭐ elevenEnabled IS NEVER SET HERE. See the header: a generated problem has no
     cached clip, so the natural voice would bill per problem. Abrabot is the browser
     voice on purpose. -->
<script>
  var CODE = "";                       // the login constant voice.js reads per clip
  // Identity, for the same reason pilot.html uses identity: the drill lane never
  // touches the TTS cache at all, so a transform here could only introduce a
  // difference between what is shown and what is said.
  function forSpeech(t) { return String(t == null ? "" : t); }
  // (mx) ⚠️ HIS OWN NAME, SAID PROPERLY. Jim heard the browser voice read
  // "Abrabot" as "ah-brab-oh" -- wrong stress, and it swallows the final t
  // entirely. Splitting the word forces the engine to say both halves:
  // "Abra" + "bot". The SCREEN still reads Abrabot; only the speech changes.
  // ⚠️ THIS IS APPLIED TO ABRABOT'S OWN LINES ONLY, never Mr. Cadabra's. His
  // audio is pre-rendered and the cache is keyed on the VERBATIM text, so
  // respelling anything he says would miss the cache and bill a live render
  // for every line -- which is the exact rule forSpeech above exists to keep.
  function sayableForRobot(t) {
    return String(t == null ? "" : t).replace(/Abrabot/g, "Abra-bot");
  }
  var __voiceSpoke = false;
  var __mood = "idle";                 // (mi) what his face is doing right now
  function setState(s) {
    if (s === "speaking") { __voiceSpoke = true; __mood = "speaking"; }
  }
</script>
<script src="/static/voice.js"></script>
<script>
  // ---- (mi) ABRABOT'S VOICE ----------------------------------------------------
  // Set AFTER voice.js loads, because voice.js declares `voiceProfile` and this
  // assigns to it. Leaving it unset is what every other page does, and that path is
  // unchanged -- see voice.js's build-mi note.
  // ⚠️ THE PITCH IS THE GUARANTEE. On a machine with one English voice installed,
  // no preference list can tell two characters apart; the rate and pitch shift can,
  // and always applies. The names below are the bonus when there IS a spare voice.
  voiceProfile = {
    name: "Abrabot",
    prefer: ["zira", "samantha", "google us english", "susan", "karen", "moira",
             "fiona", "victoria", "google uk english female", "female"],
    rate: 1.06,        // a shade brisker than Mr. Cadabra's 1.0 -- he drills, not teaches
    pitch: 1.35        // clearly above his 0.9: a machine helper, not the teacher
  };
  // (mj) THE LANE. Every speak-prep from this page carries it, and the SERVER uses it
  // to refuse any text outside the scripted closure and to mint a cache-only ticket.
  // This is why the page may safely ask for Mr. Cadabra's real voice at all.
  voiceLane = "drill";
  if (window.speechSynthesis) {
    pickVoice();
    speechSynthesis.onvoiceschanged = pickVoice;
  }
</script>
<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var qs = new URLSearchParams(location.search);
  var DEV = qs.get("dev") === "1";
  CODE = (qs.get("code") || "").trim();
  try { CODE = CODE || sessionStorage.getItem("mt_drill_code") || ""; } catch (e) {}
  if (CODE) $("code").value = CODE;
  if (DEV) $("devbar").style.display = "block";
  window.boardWarn = function (msg) { devline(msg); };

  var LESSONS = [];
  var CURRENT_ID = null;
  var queue = [];
  var busy = false;

  function devline(s) {
    if (!DEV) return;
    $("devbar").textContent = s + "  ·  " + ($("devbar").textContent || "").slice(0, 160);
  }

  // ---------- (mi) ABRABOT'S FACE ----------
  // The same robot the main app has drawn since build ej, in his own paint. ONE
  // animation loop drives all three canvases -- the small mark in the header (so he
  // is alive on the picker screen too), the big one beside his words, and Mr.
  // Cadabra's.
  // ⭐ (mn) THE PRESENCE FOLLOWS THE PERSONA. tutor-face.js's presence layer is
  // VIDEO OF A REAL PERSON -- Mr. Cadabra -- so HIS canvas wears it (Jim's ruling,
  // 2026-08-24: "when it goes back to mister Cadabra, it needs to show his face")
  // and every other persona structurally gets presence:false, so no other character
  // can ever wear it here. PART 3dg pins the rule.
  var FACES = [];          // {el, ctx, persona}
  var faceT = 0, faceLevel = 0;
  var WHO = "abrabot";     // who is on stage right now
  function faceTargetLevel() {
    if (__mood === "speaking") return 0.45 + 0.30 * Math.abs(Math.sin(faceT * 0.05));
    return 0.10 + 0.05 * Math.sin(faceT * 0.035);          // idle breathing
  }
  function drawFaces() {
    var lv = faceTargetLevel();
    faceLevel += (lv - faceLevel) * 0.22;
    for (var i = 0; i < FACES.length; i++) {
      var c = FACES[i];
      try {
        if (window.TutorFace) {
          // (mj) A face only animates its mouth while ITS OWN character is talking.
          // Both canvases are always drawn -- one of them is mid-flight, and a robot
          // that froze while it flew would read as a broken image.
          var live = (c.persona === WHO);
          TutorFace.draw(c.ctx, c.el.width, c.el.height, {
            level: live ? faceLevel : 0.10, t: faceT,
            mood: live ? __mood : "idle",
            palette: TutorFace.PALETTES && TutorFace.PALETTES[c.persona],
            // ⭐ (mn) presence BY IDENTITY, never by flag. Only Mr. Cadabra's own
            // canvas may mount the presence layer -- it is video of the real person,
            // and the expression below makes it impossible for any other persona to
            // ask for it. The purple robot keeps drawing underneath as his fallback:
            // a missing or erroring presence.json lands there (a normal state, not a
            // fault), exactly as it does on the session page.
            presence: c.persona === "cadabra"
          });
        }
      } catch (e) {}
    }
    faceT += 1;
    requestAnimationFrame(drawFaces);
  }
  [["botMark", "abrabot"], ["botFace", "abrabot"], ["cadFace", "cadabra"]]
    .forEach(function (pair) {
      var e = $(pair[0]);
      if (e && e.getContext) FACES.push({ el: e, ctx: e.getContext("2d"), persona: pair[1] });
    });
  if (FACES.length) drawFaces();

  // ---------- (mj) THE HANDOFF: one flies out, the other flies in ----------
  // Jim: "Can we have it fly in and replace mr cadabra when it enters the game."
  // The slot holds both; CSS transforms do the travelling so the board never reflows
  // under a student who is reading it.
  var FLY_MS = 420;
  function showWho(who) {
    if (who === WHO) return;
    WHO = who;
    var inEl = $(who === "cadabra" ? "whoCad" : "whoAbra");
    var outEl = $(who === "cadabra" ? "whoAbra" : "whoCad");
    if (!inEl || !outEl) return;
    outEl.classList.add("away");
    inEl.style.display = "";
    // a frame on screen in its "arriving" pose before the class comes off, or the
    // browser collapses display+transform into no animation at all
    inEl.classList.add("arriving");
    requestAnimationFrame(function () {
      requestAnimationFrame(function () { inEl.classList.remove("arriving"); });
    });
    setTimeout(function () {
      if (WHO !== who) return;
      outEl.style.display = "none";
      outEl.classList.remove("away");
      outEl.classList.add("arriving");
    }, FLY_MS);
  }

  // ---------- the picker ----------
  // A count of null means the server's background warm walk has not measured that
  // lesson yet -- NOT that it has no problems. Saying "checking…" is the honest
  // rendering of an unknown, and a reload a few seconds later shows the real number.
  // (nm) THE WALL BECOMES TEN DOORS. Jim: "if I'm in geometry, I have to scroll
  // down half a page... it would be great if each of these courses was there, you
  // click on a course, and you get a drop down menu." One card per course, tap to
  // open its units; the course you arrived FROM (?course= in the drill link) opens
  // itself. ⚠️ AND THE CLICK FEEDBACK MOVED TO THE FINGER: the old picker put every
  // message at the TOP of a half-page wall ("none of the clicks worked" -- they
  // worked, and answered where nobody was looking). A tapped lesson now says
  // "Starting…" on its own button and complains right underneath itself.
  function paintPicker(j) {
    LESSONS = j.lessons || [];
    var pk = $("picker"); pk.innerHTML = "";
    var wantCourse = (qs.get("course") || "").trim();
    var byCourse = [];   // [{id, title, lessons:[...]}] in server order
    LESSONS.forEach(function (les) {
      var last = byCourse[byCourse.length - 1];
      if (!last || last.id !== les.course) {
        byCourse.push({ id: les.course, title: les.course_title || les.course,
                        lessons: [] });
        last = byCourse[byCourse.length - 1];
      }
      last.lessons.push(les);
    });
    byCourse.forEach(function (co) {
      var ready = co.lessons.filter(function (l) { return l.drill > 0; }).length;
      var head = document.createElement("button");
      head.type = "button"; head.className = "opt";
      head.style.cssText = "font-size:17px;font-weight:850;text-align:left;"
        + "display:flex;justify-content:space-between;align-items:center";
      head.innerHTML = "<span>" + co.title + "</span>"
        + '<span style="font-weight:600;font-size:13px;color:var(--muted)">'
        + (j.available === false ? "unavailable"
           : (ready ? ready + " lessons ▸" : "counting… ▸")) + "</span>";
      var body = document.createElement("div");
      body.style.cssText = "display:none;flex-direction:column;gap:8px;"
        + "margin:2px 0 8px 10px;padding-left:10px;border-left:3px solid var(--line)";
      head.onclick = function () {
        var open = body.style.display !== "none";
        // one course open at a time -- the whole point is not scrolling
        pk.querySelectorAll(".drillbody").forEach(function (d) { d.style.display = "none"; });
        pk.querySelectorAll(".drillhead .chev").forEach(function (c) { c.textContent = "▸"; });
        body.style.display = open ? "none" : "flex";
      };
      head.className += " drillhead";
      body.className = "drillbody";
      var lastUnit = null;
      co.lessons.forEach(function (les) {
        if (les.unit !== lastUnit) {
          lastUnit = les.unit;
          var hdr = document.createElement("div");
          hdr.textContent = "Unit " + les.unit;
          hdr.style.cssText = "font-size:12.5px;font-weight:800;color:var(--muted);"
            + "text-transform:uppercase;letter-spacing:.06em;margin:8px 0 0";
          body.appendChild(hdr);
        }
        var b = document.createElement("button");
        b.type = "button"; b.className = "opt";
        b.style.fontSize = "16px"; b.style.textAlign = "left";
        var label = les.topic;
        if (les.drill === null && j.available === false) { label += "  (unavailable)"; }
        else if (les.drill === null) { label += "  (counting…)"; }
        else if (les.drill === 0) { label += "  (no extra problems)"; b.className += " none"; }
        else { label += "  (" + les.drill + " extra)"; }
        b.textContent = label;
        b.disabled = (les.drill === 0);
        b.onclick = function () { startDrill(les.id, b); };
        body.appendChild(b);
      });
      pk.appendChild(head); pk.appendChild(body);
      if (co.id === wantCourse) { body.style.display = "flex"; }
    });
    // (mm) A server that never loaded drillpool.py has no counts to give and never
    // will. Saying "checking…" forever would be true of the memo and useless to a
    // person, so the page says the real thing and stops.
    if (j.available === false) {
      $("warm").textContent = "Abrabot's extra problems are not loaded on this server "
        + "right now — lessons still work normally.";
    } else if (!j.ready) {
      $("warm").textContent = "Abrabot is counting his problems (" + (j.warmed || 0)
        + " of " + (j.total || 0) + " lessons) — reload in a moment to see them all.";
    } else {
      $("warm").textContent = "";
    }
  }
  function loadPicker() {
    fetch("/api/drill/lessons").then(function (r) { return r.json(); })
      .then(paintPicker)
      .catch(function () {
        $("gateMsg").textContent = "Could not load the lesson list — is the server awake?";
      });
  }
  loadPicker();
  loadPractice();

  // ---------- starting ----------
  function noteUnder(btn, text) {
    // (nm) the message lands where the finger is, not at the top of a long page
    var n = btn.nextElementSibling;
    if (!n || n.className !== "tapnote") {
      n = document.createElement("div"); n.className = "tapnote";
      n.style.cssText = "font-size:13.5px;font-weight:700;color:#b3411f;margin:2px 0 4px";
      btn.parentNode.insertBefore(n, btn.nextSibling);
    }
    n.textContent = text;
  }
  function startDrill(lessonId, btn) {
    CODE = ($("code").value || "").trim();
    if (!CODE) {
      $("gateMsg").textContent = "Enter your student code first — it goes in the box at the top.";
      if (btn) noteUnder(btn, "First type your student code in the box at the top of this page — then tap again.");
      $("code").focus();
      window.scrollTo({ top: 0, behavior: "smooth" });
      return;
    }
    try { sessionStorage.setItem("mt_drill_code", CODE); } catch (e) {}
    // A REAL TAP: the only moment a browser lets us open the audio pipeline early.
    // The browser voice needs the gesture as much as the natural one does.
    try { warmUpAudio(); } catch (e) {}
    var oldLabel = btn ? btn.textContent : "";
    if (btn) { btn.disabled = true; btn.textContent = oldLabel + "  — starting…"; }
    var restore = function (msg) {
      if (btn) { btn.disabled = false; btn.textContent = oldLabel;
                 if (msg) noteUnder(btn, msg); }
    };
    post("/api/drill/start", { code: CODE, lesson: lessonId }, function (j) {
      CURRENT_ID = j.id || lessonId;
      $("gate").classList.add("hide");
      $("stage").classList.remove("hide");
      _lastRight = 0; _justRight = false;      // (mi) a new lesson, a fresh tally
      showScore(j.score, j.struggling);
      ingest(j.steps);
    }, restore);
  }

  // ---------- voice: DELEGATED to voice.js ----------
  var VOICE_WAIT_MS = 3000;
  // (nb) 2026-08-24 -- THE TWO FAILURES THIS TIMER WAS CONFLATING.
  // Jim: "it's very distracting to have him talk and then have this next button show
  // up, because it feels like I'm supposed to push it."
  // ⚠️ THREE SECONDS OF *NOT HAVING FINISHED* IS NOT A FAILURE. The timer above asked
  // "has this finished yet?" and Mr. Cadabra's introduction is several sentences --
  // fifteen, twenty seconds of speech -- so it fired EVERY time, mid-sentence, while
  // he was still audibly talking. Build mx hid the button until it was needed and
  // then handed the timer the key.
  //   nothing audible after 3s  -> it really is not coming. Offer the button.
  //   audible and still going   -> he is TALKING. Do not put a button under him.
  // The second case still needs a floor -- a clip CAN stall half-way -- so instead of
  // no watchdog we wait out the clip's whole estimated length and then some.
  var VOICE_STALL_PAD_MS = 6000;
  // ⭐ DELIBERATELY SLOWER THAN ANY REAL NARRATION. 85ms/char is about 12 characters a
  // second; Mr. Cadabra's rendered voice runs nearer 15. Over-estimating costs a few
  // seconds in the rare stall; under-estimating puts a button under a talking teacher,
  // which is the defect being fixed. When in doubt, let him finish.
  function sayMsEstimate(t) {
    var n = String(t == null ? "" : t).length;
    return Math.min(180000, Math.max(2500, n * 85));
  }
  // (mj) `step` decides WHO is speaking and whether his real voice is worth asking
  // for. natural=true only for Mr. Cadabra's already-authored, already-rendered
  // lines; the server refuses a drill ticket for anything else regardless, and a
  // refusal or an unrendered line falls to the browser voice with no retry.
  // (nb) `patient` -- TRUE means "never interrupt a clip that is audibly playing".
  // ⚠️ IT IS NOT THE DEFAULT, AND THAT IS ON PURPOSE. The `ask` beat passes its
  // onWaiting to UNLOCK THE ANSWER BUTTONS, and a student who can hear the question
  // must never be locked out of answering it while it finishes -- being early is
  // right there and wrong under a `say`. One timer, two honest meanings, named.
  function speak(text, onDone, onWaiting, step, patient) {
    var t0 = performance.now(), done = false, warnTimer = null;
    function finish(played) {
      if (done) return;
      done = true;
      if (warnTimer) { clearTimeout(warnTimer); warnTimer = null; }
      onDone && onDone(!!played);
    }
    if (!text) return finish(false);
    __voiceSpoke = false;
    var nudge = function () { if (!done) onWaiting && onWaiting(); };
    warnTimer = setTimeout(function () {
      if (done) return;
      // ⚠️ (nb) NOTHING HAS BEEN HEARD YET -- and that, only that, is what three
      // seconds of silence is evidence of. voice.js flips __voiceSpoke through
      // setState("speaking") the moment audio is actually audible.
      if (!__voiceSpoke || !patient) return nudge();
      // HE IS TALKING. Wait out the whole clip before offering a way past him; if it
      // really has stalled, the button still arrives, just not on top of his voice.
      warnTimer = setTimeout(nudge, Math.max(0,
        (t0 + sayMsEstimate(text) + VOICE_STALL_PAD_MS) - performance.now()));
    }, VOICE_WAIT_MS);
    var p;
    var who = (step && step.who) || "abrabot";
    var opts = (who === "cadabra")
      ? { eleven: !!(step && step.natural), profile: null }   // profile null = HIS voice
      : { eleven: false };                                    // Abrabot: browser, always
    // (mx) the respelling rides ONLY on the browser-voiced robot -- see above.
    var sayText = (who === "cadabra") ? text : sayableForRobot(text);
    try { p = window.speak ? window.speak(sayText, opts) : null; } catch (e) { p = null; }
    if (!p || !p.then) return finish(false);
    p.then(function () {
      devline("clip done in " + Math.round(performance.now() - t0)
              + "ms, audible=" + __voiceSpoke);
      __mood = "idle";                    // (mi) he stops moving his mouth when he stops
      finish(__voiceSpoke);
    }, function () { __mood = "idle"; finish(false); });
  }

  // ---------- score ----------
  var _lastRight = 0, _justRight = false;
  function showScore(score, struggling) {
    if (!score) return;
    // (mi) A RIGHT ANSWER IS REMEMBERED, NOT SHOWN YET. His smile lands when the
    // praise has finished being said -- smiling underneath his own talking mouth
    // would be invisible, which is how the first version of this looked.
    if (score.right > _lastRight) _justRight = true;
    _lastRight = score.right;
    $("score").textContent = score.asked
      ? (score.right + " right out of " + score.asked)
      : "";
    if (DEV && struggling) devline("STRUGGLING (phase 4 fetches Mr. Cadabra here)");
  }

  // ---------- playing the step queue ----------
  function playStep(step) {
    var markup = step.board || step.spoken || "";
    var f = boardEl();
    if (f) {
      var keep = f.innerHTML;
      wipeBoard();
      if (!drawBoard(markup)) f.innerHTML = keep;      // nothing new: keep the last
      f.style.display = f.innerHTML ? "block" : "none";
    }
    var words = step.spoken || "";
    $("bubble").innerHTML = styleTerms(words);

    // (mj) WHO IS ON STAGE. Every step names its speaker; a step that forgot lands on
    // Abrabot, which is the safe default because Abrabot never uses the paid voice.
    showWho(step.who === "cadabra" ? "cadabra" : "abrabot");

    var ctl = $("controls"); ctl.innerHTML = "";

    // (mj) arrive / teach / leave are Mr. Cadabra's beats. They PLAY like a say beat
    // -- words, a board, one Next -- so there is exactly one narration path on this
    // page rather than a second one to keep in step with the first.
    // (om) `intro` rides through the re-wrap -- dropping it here would hide the
    // skip button on exactly the steps it exists for.
    if (step.kind === "arrive" || step.kind === "teach" || step.kind === "leave") {
      step = { kind: "say", spoken: step.spoken, board: step.board,
               who: step.who, natural: step.natural, intro: step.intro };
    }

    if (step.kind === "say") {
      // (mx) ⚠️ THE BUTTON IS HIDDEN UNTIL IT IS NEEDED. Jim, 2026-08-24: "it has a
      // button underneath each one that says next. You never need to push the
      // button. So why is the button even there?" He was right: when the words
      // actually play, the page advances itself and the button is furniture a
      // student is invited to press for nothing. It still EXISTS, because when the
      // speech is silent -- no engine, blocked autoplay, a muted tab -- a reader
      // is pacing themselves and the button is the only way on. So it appears
      // exactly then: when speaking finished without a sound, or when it is
      // taking too long.
      var b = document.createElement("button");
      b.className = "next"; b.textContent = "Next ▶"; b.disabled = true;
      b.style.display = "none";
      var advanced = false;
      var go = function () { if (!advanced) { advanced = true; playNext(); } };
      b.onclick = go;
      var reveal = function () { b.style.display = ""; b.disabled = false; };
      ctl.appendChild(b);
      // (om, 2026-08-27) Jim: "The introduction to Abrabot should have a skip
      // introduction button, so I don't have to listen to it over and over
      // again." Visible the whole time an INTRO step is playing (server-marked;
      // nothing else ever carries the mark, so this can never skip teaching).
      // Skipping: silence the current clip, drop every remaining intro step,
      // and walk straight into the practice. `advanced` is set FIRST so the
      // interrupted clip's own onDone can never double-advance past the first
      // real step. The mx law holds: this is not a button under a talking
      // teacher for no reason -- it is the door past a speech the listener has
      // already heard, which is exactly what Jim asked for.
      if (step.intro) {
        var sk = document.createElement("button");
        sk.className = "opt"; sk.textContent = "⏭ Skip the intro";
        sk.onclick = function () {
          if (advanced) return;
          advanced = true;
          try { if (typeof stopAllSpeech === "function") stopAllSpeech(); } catch (e) {}
          __mood = "idle";
          queue = queue.filter(function (s) { return !s.intro; });
          playNext();
        };
        ctl.appendChild(sk);
      }
      // Auto-advance only when the words GENUINELY played. Silent (no speech engine,
      // blocked autoplay) means a reader is pacing themselves, and racing them is
      // worse than the stall it fixes -- the same rule pilot.html settled on.
      speak(words, function (played) {
        // (mj) only Abrabot smiles at a right answer -- Mr. Cadabra is mid-lesson
        if (_justRight && step.who !== "cadabra") { _justRight = false; faceHappy(); }
        // (mx) it PLAYED, so the page moves on by itself and the button never
        // appears. It did NOT play, so a reader needs a way forward.
        if (played) { setTimeout(go, 650); }
        else { reveal(); b.focus(); }
        // (nb) patient=true: while he is audibly talking, no button appears under him.
      }, reveal, step, true);
      $("status").textContent = "";
      return;
    }

    if (step.kind === "ask") {
      var opts = choiceValues(step.choices || "");
      opts.forEach(function (v) {
        var ob = document.createElement("button");
        ob.className = "opt"; ob.textContent = v; ob.disabled = true;
        ob.onclick = function () { answer(parseInt(v, 10), ctl); };
        ctl.appendChild(ob);
      });
      var enable = function () {
        ctl.querySelectorAll("button").forEach(function (x) { x.disabled = false; });
      };
      speak(words, enable, enable, step);   // a slow clip must never lock the answers
      $("status").textContent = "Tap your answer.";
      return;
    }

    if (step.kind === "end") {
      $("score").textContent = step.right + " right out of " + step.asked;
      speak(words, function () {}, null, step);
      if (step.more) {
        var nb = document.createElement("button");
        nb.className = "next"; nb.textContent = "Another round ▶";
        nb.onclick = function () {
          post("/api/drill/next", { code: CODE }, function (j) {
            showScore(j.score, j.struggling);
            ingest(j.steps);
          });
        };
        ctl.appendChild(nb);
      }
      // (nw, 2026-08-26) Jim: "Abrabot says 'pick another lesson' and no other
      // option. How about return to the course, or end for now?" Three doors:
      // another lesson (reload the picker), back to the lesson (session, same
      // code+course), done for now (the student's home menu).
      var _co = (new URLSearchParams(location.search).get("course") || "").trim();
      var cq = "?code=" + encodeURIComponent(CODE) +
               (_co ? "&course=" + encodeURIComponent(_co) : "");
      var done = document.createElement("button");
      done.className = "opt"; done.textContent = "Pick another lesson";
      done.onclick = function () { location.reload(); };
      ctl.appendChild(done);
      var back = document.createElement("button");
      back.className = "opt"; back.textContent = "\u{1F3EB} Back to my lesson";
      back.onclick = function () { location.href = "/session" + cq; };
      ctl.appendChild(back);
      var bye = document.createElement("button");
      bye.className = "opt"; bye.textContent = "\u{1F44B} Done for now";
      bye.onclick = function () { location.href = "/home" + cq; };
      ctl.appendChild(bye);
      $("status").textContent = "Practice only — Abrabot never changes your progress.";
      return;
    }
  }
  // (mi) A CORRECT ANSWER SHOWS ON HIS FACE. TutorFace's "happy" mood is a real
  // expression the robot already knows how to wear; this is the first time anything
  // has asked Abrabot for it. Deliberately NOT TutorFace.celebrate(): that fires the
  // gold burst the main app uses to mark a problem finished in a LESSON, and drill is
  // practice. A brief smile is the honest size of the moment.
  function faceHappy() {
    __mood = "happy";
    setTimeout(function () { if (__mood === "happy") __mood = "idle"; }, 1100);
  }

  function playNext() { if (queue.length) playStep(queue.shift()); }
  function ingest(steps) { queue = queue.concat(steps || []); playNext(); }

  // ---------- the API calls ----------
  function post(url, body, onOk, onErr) {
    if (busy) return;
    busy = true;
    var t0 = performance.now();
    fetch(url, { method: "POST", headers: { "Content-Type": "application/json" },
                 body: JSON.stringify(body) })
      .then(function (r) { return r.json().then(function (j) { return { s: r.status, j: j }; }); })
      .then(function (rj) {
        busy = false;
        devline(url.split("/").pop() + " " + Math.round(performance.now() - t0) + "ms");
        if (rj.s !== 200) {
          var msg = (rj.j && rj.j.detail) || "Something went wrong.";
          // (nm) tell the caller IN PLACE first -- the top-of-page fallback stays,
          // but on a long picker it answered where nobody was looking.
          if (onErr) { onErr(msg); }
          $("gateMsg").textContent = msg;
          if (!onErr) {
            $("gate").classList.remove("hide");
            $("stage").classList.add("hide");
            window.scrollTo({ top: 0, behavior: "smooth" });
          }
          return;
        }
        onOk(rj.j);
      })
      .catch(function () { busy = false;
        if (onErr) { onErr("Connection hiccup — tap again."); }
        $("status").textContent = "Connection hiccup — tap again."; });
  }
  function answer(value, ctl) {
    ctl.querySelectorAll("button").forEach(function (x) { x.disabled = true; });
    // (mt) THE STUDENT'S OWN DAY travels with the answer, the same way the hours tiles
    // send it. A kid practising at 8pm is practising today, not tomorrow.
    post("/api/drill/answer", { code: CODE, value: value, day: localDay() },
         function (j) {
      showScore(j.score, j.struggling);
      ingest(j.steps);
      loadPractice();            // the counter should move while they watch
    });
  }

  // ---------- (mt) WHAT THE STUDENT CAN SHOW ----------
  function localDay() {
    var d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0")
           + "-" + String(d.getDate()).padStart(2, "0");
  }
  function loadPractice() {
    if (!CODE) return;
    fetch("/api/drill/stats/" + encodeURIComponent(CODE) + "?days=7")
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) {
        if (!j || !j.tracking) return;          // DB off: say nothing, invent nothing
        var week = (j.by_day || []).reduce(function (t, d) { return t + d.asked; }, 0);
        if (!j.total_asked) return;             // no wall of zeros on a first visit
        $("pracCard").classList.remove("hide");
        $("pToday").textContent = j.today_asked;
        $("pWeek").textContent = week;
        $("pAll").textContent = j.total_asked;
        // ⚠️ NO PERCENTAGE UNTIL THERE IS ENOUGH OF ONE TO BE FAIR. A student who
        // has just met a hard idea and missed the first two would otherwise be
        // shown "0% you got right" in 26px type, which is a billboard telling a
        // seven-year-old they are bad at this. Ten problems in, the number means
        // something and they have had a chance to move it.
        var enough = j.total_asked >= 10;
        $("pAcc").textContent = (!enough || j.accuracy_pct === null
                                 || j.accuracy_pct === undefined)
                                  ? "—" : j.accuracy_pct + "%";
        $("pAccLab").textContent = enough ? "you got right" : "keep going";
        $("pDays").textContent = j.days_practiced;
        // seven bars, tallest = the busiest day, so a week of practice is a SHAPE a
        // parent can read across the room rather than a number to be argued with.
        var bar = $("pWeekBar"); bar.innerHTML = "";
        var max = Math.max.apply(null, (j.by_day || []).map(function (d) { return d.asked; }).concat([1]));
        var byDay = {}; (j.by_day || []).forEach(function (d) { byDay[d.day] = d.asked; });
        for (var i = 6; i >= 0; i--) {
          var dt = new Date(); dt.setDate(dt.getDate() - i);
          var key = dt.getFullYear() + "-" + String(dt.getMonth() + 1).padStart(2, "0")
                    + "-" + String(dt.getDate()).padStart(2, "0");
          var n = byDay[key] || 0;
          var el = document.createElement("div");
          el.style.height = Math.max(4, Math.round(40 * n / max)) + "px";
          el.style.opacity = n ? "1" : "0.28";
          el.title = n + " practised";
          el.innerHTML = '<span>' + "SMTWTFS".charAt(dt.getDay()) + '</span>';
          bar.appendChild(el);
        }
      })
      .catch(function () {});
  }
})();
</script>
