    judged the clip by `audioEl.paused || !audioEl.duration`. A CACHED clip is

    once and the valve stayed quiet. An UNCACHED clip is served as a chunked
    StreamingResponse with NO Content-Length, so `duration` is NaN or Infinity

    `paused` is still true. Either way the valve declared a perfectly good clip
    dead, lit "Next" mid-sentence, and the next tap cut the line off mid-word --
    which is why it only misbehaved while the prewarm was still running and most
    lines were uncached. The valve is now a WATCHDOG that judges what actually
    matters, playback PROGRESS (currentTime advancing), on the element it created
    rather than on a shared global that a later clip may have replaced. It also
    stops guessing about "usable": controls unlock early via onWaiting WITHOUT
    pretending the clip failed, so a slow line is never cut short and a silent
    one never strands the child.

      no waiting — in Mr. Cadabra’s own voice. Raise your hand any time to ask
      him something.</p>
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:6px">
      <input id="code" inputmode="numeric" placeholder="code" autocomplete="off">
      <span style="color:var(--muted);font-size:14px">your student code — then tap a lesson to start it</span>
    </div>
    <div id="gateMsg" style="color:#b3402e;font-weight:700;margin:6px 0"></div>
    <div id="picker" style="display:flex;flex-direction:column;gap:8px"></div>
  </div>

  <div class="card hide" id="stage">
    <!-- (oy) THE DAY, LESSON BY LESSON. Jim: "as we go through lesson by lesson by
         lesson, we should see progress at being attained, not just in big chunks...
         so I feel like I'm getting something done." One segment per lesson in this
         slice; the one being worked fills as problems are answered. -->
    <div class="daybar" id="dayBar" hidden>

         hidden otherwise, so mic.js has stable elements to hold (it reaches for
         talkBtn / talkLabel / hint / live / statusEl by NAME -- see the contract
         block below). Rebuilding these per beat would hand it dead references. -->
    <div id="answerbar" class="answerbar" hidden>
      <button id="talkBtn" class="talkbtn" type="button" disabled
              aria-label="Say your answer out loud">🎤 <span id="talkLabel">Say it</span></button>
      <input id="sayInput" autocomplete="off" placeholder="…or type your answer and press Enter">

<!-- (kj) THE WHITEBOARD. board-text.js MUST load before board.js (it defines

     MathFigures.svg / GeoFigures.svg. board.css carries the styles that used to live

<!-- (mh) THE BOARD LAYER IS A FILE NOW. Everything that used to be declared
     inline here -- board.js's ambient contract, the one-board-per-beat helpers
     and the scripted tag dispatcher -- lives in script-board.js so the Abrabot
     drill page draws with the SAME code instead of a copy that would drift.
     Nothing that moved changed. It must load BEFORE board.js, which reads these
     names as bare globals. -->
<script src="/static/script-board.js"></script>
<script src="/static/board.js"></script>

<!-- (ki) THE VOICE LAYER. voice.js owns the audio graph, the keep-alive, the lead
     ladder, the watchdog, the retry and the browser fallback. This page satisfies its
     ambient contract (CODE / forSpeech / setState) and otherwise stays out of the way. -->
<script>
  // ---- voice.js's ambient contract, provided by this page ----
  var CODE = "";                       // the login constant voice.js reads per clip

  // ⭐ IDENTITY ON PURPOSE -- DO NOT "FIX" THIS BY LOADING speech-text.js.
  // The TTS cache is keyed on the exact text and /api/admin/script-prewarm cached the
  // raw closure strings. Any transform here makes every one of the 3,879 cached lines
  // a MISS and re-renders the whole course at full price, killing the latency claim
  // the scripted-first pivot rests on. session.html transforms because its text is
  // generated and carries notation; scripted lines are authored TTS-safe and
  // lessonscripts.validate() enforces that. This is the one place the pages differ.
  function forSpeech(t) { return String(t == null ? "" : t); }

  // voice.js calls setState("speaking") the moment audio genuinely starts. That is a
  // better "did it play?" signal than anything this page could measure itself, and it
  // is what decides whether a beat auto-advances or waits for a tap.
  var __voiceSpoke = false;
  function setState(s) { if (s === "speaking") __voiceSpoke = true; }

  // ---- (ou) mic.js's ambient contract, provided by this page ----------------
  // ⭐ ONE RECORDER, NOT TWO. mic.js owns permission handling, the 30-second cap,
  // the transcribe call, and the F10 distinction between "the request failed" and
  // "you said nothing". voice.js's own header records what happened the last time
  // this lane hand-ported an audio layer instead of loading the real one: four
  // copies, each missing a different protection. So this page satisfies the
  // contract (the bare names below are the ones mic.js reaches for) rather than
  // growing a recorder of its own.
  var canRecord = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)
    && (typeof MediaRecorder !== "undefined");
  // ⚠️ NO `paused` HERE. voice.js declares it (let paused, build hd) and loads
  // right after this block -- a second declaration is a SyntaxError that kills
  // voice.js outright, taking Mr. Cadabra's voice with it. The pilot drive caught
  // exactly that. mic.js reads `paused` at call time, by which point voice.js has
  // defined it, so the contract is satisfied without re-declaring anything.
  var phase = "idle";                  // idle | ready | recording | busy
  var lastTutorText = "";              // what he just asked (expectsALetter reads it)
  var hint = null, statusEl = null, live = null, talkBtn = null, talkLabel = null;
  function setPhase(p) {
    phase = p;
    if (!talkBtn) return;
    talkBtn.disabled = (p !== "ready" && p !== "recording");
    talkBtn.classList.toggle("recording", p === "recording");
    if (talkLabel) talkLabel.textContent = (p === "recording") ? "Stop" : "Say it";
  }
  // mic.js hands the finished transcript here; the scripted lane grades it in CODE.
  function sendToTutor(text) { if (window.__pilotSaid) window.__pilotSaid(text); }
</script>
<script src="/static/voice.js"></script>
<script src="/static/mic.js"></script>
<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var QUIZ_ON = false;                 // (ov) a quiz is running: no ✋, no AI, no second try
  // (ou) bind mic.js's contract to real elements (declared as globals above, so a
  // bare assignment here fills them in -- this IIFE is strict, and that is fine
  // because the names already exist).
  hint = $("hint"); statusEl = $("status"); live = $("live");
  talkBtn = $("talkBtn"); talkLabel = $("talkLabel");
  micTypeHint = "type it in the box";
  var qs = new URLSearchParams(location.search);
  var DEV = qs.get("dev") === "1";
  var FCOURSE = (qs.get("course") || "").trim();   // (op) the pilot lens
  var FUNIT = parseInt(qs.get("unit") || "", 10) || 0;
  CODE = (qs.get("code") || "").trim();       // (ki) the global voice.js reads
  try { CODE = CODE || sessionStorage.getItem("mt_pilot_code") || ""; } catch (e) {}
  if (CODE) $("code").value = CODE;
  if (DEV) $("devbar").style.display = "block";

  // build jw/ka: the course picker. Ids come from the server so the page never
  // hardcodes a lesson list it could drift from. TAPPING A LESSON STARTS IT --
  // Jim's playtest found the old separate Start button buried under 24 entries.
  function startLesson(lessonId) {
    CODE = ($("code").value || "").trim();
    if (!CODE) {
      $("gateMsg").textContent = "Enter your student code first — it goes in the box at the top.";
      $("code").focus();
      window.scrollTo({ top: 0, behavior: "smooth" });
      return;
    }
    try { sessionStorage.setItem("mt_pilot_code", CODE); } catch (e) {}
    // (ki) we are inside a REAL TAP -- the only moment a browser lets us open the
    // audio pipeline early. voice.js's warmUpAudio also starts the build-cb keep-alive.
    try { warmUpAudio(); } catch (e) {}
    post("/api/script/start", { code: CODE, lesson: lessonId }, function (j) {
      CURRENT_ID = j.id || lessonId || (LESSONLIST[0] && LESSONLIST[0].id) || null;
      LESSON_STEP = 0; renderDay();          // (oy) a new lesson, a fresh segment
      var cur = null;
      for (var ci = 0; ci < LESSONLIST.length; ci++) {
        if (LESSONLIST[ci].id === CURRENT_ID) { cur = LESSONLIST[ci]; break; }
      }
      window.COURSE = (cur && cur.course) || FCOURSE || "";
      $("gate").classList.add("hide");
      $("stage").classList.remove("hide");
      ingest(j.steps);
    });
  }
  // (ki) voice.js speaks only when it knows the natural voice is available; the page
  // owns that flag. A failure here simply leaves the browser voice in charge.
  fetch("/api/voice-status").then(function (r) { return r.json(); })
    .then(function (j) { elevenEnabled = !!(j && j.eleven); })
    .catch(function () {});

  // (op) RENAMED from COURSE: board.js's owner-flag body reads a global COURSE
  // as the course STRING; an array there would ride into /api/flag. The string
  // global below is set the moment a lesson starts.
  var LESSONLIST = [];      // the ordered lessons list (kd: next-lesson flow)
  window.COURSE = "";       // the CURRENT lesson's course, for the 🚩 flag body
  var CURRENT_ID = null;    // which lesson this session is playing
  // (oy) THE DAY STRIP. DONE_IDS are the lessons finished in THIS sitting; STEP is
  // how far into the current one the work has got. Progress you can watch move --
  // every answered problem nudges it, not just the end of a lesson.
  var DONE_IDS = {};
  var LESSON_STEP = 0;
  var LESSON_STEPS = 6;     // nudges before a lesson's own end beat fills it
  fetch("/api/script/lessons").then(function (r) { return r.json(); })
    .then(function (j) {
      LESSONLIST = j.lessons || [];
      // (op) THE PILOT LENS: ?course= and ?unit= narrow the picker to the slice
      // being piloted (the home hub links prealgebra Unit 1 here). No filter,
      // no change -- the full picker stays exactly as it was.
      if (FCOURSE) LESSONLIST = LESSONLIST.filter(function (l) { return l.course === FCOURSE; });
      if (FUNIT) LESSONLIST = LESSONLIST.filter(function (l) { return l.unit === FUNIT; });
      var pk = $("picker"), lastUnit = null, lastCourse = null;
      LESSONLIST.forEach(function (les, i) {
        if (les.course !== lastCourse) {
          lastCourse = les.course; lastUnit = null;
          var ch = document.createElement("div");
          ch.textContent = les.course_title || les.course;
          ch.style.cssText = "font-size:16px;font-weight:850;color:var(--ink);"
            + "margin:14px 0 0;padding-top:10px;border-top:2px solid var(--line)";
          pk.appendChild(ch);
        }
        if (les.unit !== lastUnit) {
          lastUnit = les.unit;
          var hdr = document.createElement("div");
          hdr.textContent = "Unit " + les.unit;
          hdr.style.cssText = "font-size:12.5px;font-weight:800;color:var(--muted);"
            + "text-transform:uppercase;letter-spacing:.06em;margin:10px 0 2px";
          pk.appendChild(hdr);
        }
        var b = document.createElement("button");
        b.className = "opt"; b.style.fontSize = "16px"; b.style.textAlign = "left";
        b.textContent = (i + 1) + ". " + les.topic;
        b.onclick = function () { startLesson(les.id); };
        pk.appendChild(b);
      });
    }).catch(function () {
      $("gateMsg").textContent = "Could not load the course list — is the server awake?";
    });

  // (op) THE OWNER'S FLAG, scripted lane. board.js's ownerFlagAttach is generic
  // (it exits instantly for everyone without the owner key) and quotes the div
  // at tap time; innerHTML replacement removes the button, so re-attach after
  // every render.
  // (oy) draw the day: one segment per lesson in this slice, the current one
  // partially filled, and a plain sentence saying where you are and what is left.
  function renderDay() {
    var bar = $("dayBar");
    if (!bar || !LESSONLIST.length || !CURRENT_ID) { if (bar) bar.hidden = true; return; }
    bar.hidden = false;
    var at = -1;
    for (var i = 0; i < LESSONLIST.length; i++) if (LESSONLIST[i].id === CURRENT_ID) at = i;
    var track = $("dayTrack"); track.innerHTML = "";
    LESSONLIST.forEach(function (les, i) {
      var d = document.createElement("div");
      d.className = "dayseg" + (DONE_IDS[les.id] ? " done" : "");
      d.title = les.topic + (DONE_IDS[les.id] ? " — done!" : "");
      var f = document.createElement("i");
      f.style.width = (i === at && !DONE_IDS[les.id])
        ? Math.min(95, (LESSON_STEP / LESSON_STEPS) * 100) + "%" : "0%";
      d.appendChild(f);
      track.appendChild(d);
    });
    var done = 0;
    LESSONLIST.forEach(function (l) { if (DONE_IDS[l.id]) done++; });
    var rest = LESSONLIST.slice(at + 1).map(function (l) { return l.topic; });
    $("dayLine").innerHTML =
      '<span class="dim">Now:</span> <b>' + esc(LESSONLIST[at] ? LESSONLIST[at].topic : "")
      + '</b> <span class="dim">(lesson ' + (at + 1) + ' of ' + LESSONLIST.length
      + (done ? ' &middot; ' + done + ' finished today' : '') + ')</span>'
      + (rest.length ? '<br><span class="dim">Next up:</span> ' + esc(rest.slice(0, 3).join(" · "))
                       + (rest.length > 3 ? ' …' : '') : '');
  }
  function bumpLesson() { LESSON_STEP += 1; renderDay(); }

  function flagBubble() {
    try {
      if (typeof ownerFlagAttach === "function"
          && !document.querySelector("#bubble .mtflag")) ownerFlagAttach($("bubble"));
    } catch (e) {}
  }

  var queue = [];          // steps not yet played
  var current = null;      // the step awaiting the student's tap
  var busy = false;

  // ---------- the renderer: DELEGATED to script-board.js (mh) ----------
  // esc / attrs / drawBoard / choiceValues / spokenOnly / styleTerms and the
  // whole board contract now live in script-board.js, loaded above, and this
  // page inherits them from the global scope exactly as it inherits board.js's
  // renderers. window.boardWarn is the one hook the shared file offers back:
  // it reports a tag that threw, which is what ?dev=1 wants to see.
  window.boardWarn = function (msg) { devline(msg); };

  // ---------- voice: DELEGATED to voice.js (ki) ----------
  // Everything that used to live here -- the shared element, the keep-alive, the lead
  // ladder, the progress watchdog -- is voice.js's job now. Four hand-ports in a row
  // got this wrong; the fourth (kg) still missed the live AudioContext. This adapter
  // is the whole of what the page keeps: it turns voice.js's Promise into the
  // (onDone, onWaiting) shape the step player already expects.
  var VOICE_WAIT_MS = 3000;   // unlock the controls after this, WITHOUT calling it dead
  function speak(text, onDone, onWaiting) {
    var t0 = performance.now(), done = false, warnTimer = null;
    function finish(played) {
      if (done) return;
      done = true;
      if (warnTimer) { clearTimeout(warnTimer); warnTimer = null; }
      onDone && onDone(!!played);
    }
    if (!text) return finish(false);
    __voiceSpoke = false;                       // voice.js flips this via setState()
    warnTimer = setTimeout(function () {
      if (!done) onWaiting && onWaiting();      // taking a while: let them act anyway
    }, VOICE_WAIT_MS);
    var p;
    try { p = window.speak ? window.speak(text) : null; } catch (e) { p = null; }
    if (!p || !p.then) return finish(false);    // voice.js missing: silent, never stuck
    p.then(function () {
      if (DEV) devline("clip done in " + Math.round(performance.now() - t0)
                       + "ms, audible=" + __voiceSpoke);
      // AUDIBLE, not merely resolved. voice.js resolves on a browser-voice fallback
      // and on a dead clip too; auto-advancing on silence would race a student who is
      // reading rather than listening, which is the defect ke fixed.
      finish(__voiceSpoke);
    }, function () { finish(false); });
  }
  function devline(s) {
    if (!DEV) return;
    $("devbar").textContent = s + "  ·  " + ($("devbar").textContent || "").slice(0, 160);
  }

  // ---------- playing the step queue ----------
  // (oq) `quiet` = re-render a step WITHOUT re-speaking it -- the way back from a
  // raised hand: board and words return instantly, controls unlock, no clip.
  var lastStep = null;     // the step on stage (say/ask/ai), for the ✋ resume
  function playStep(step, quiet) {
    if (step && step.kind !== "ask" && step.kind !== "ai") hideAnswerBar();   // (ou)
    // (kj) draw into a CLEARED board. A praise beat carries no board of its own, so the
    // previous picture stays up rather than blinking out -- the student keeps looking at
    // the thing being praised. Same rule as before; the drawing is just real now.
    var markup = step.board || step.spoken || "";
    var f = boardEl();
    if (f) {
      var keep = f.innerHTML;
      wipeBoard();                                       // (mh) clears the board AND
      // resets the shared worklist pointer -- exactly what the two lines it replaces
      // did, except the pointer now lives in script-board.js with the code that uses it.
      if (!drawBoard(markup)) f.innerHTML = keep;        // nothing new: keep the last
      f.style.display = f.innerHTML ? "block" : "none";
    }

    var words = (step.kind === "ai") ? spokenOnly(step.spoken) : (step.spoken || "");
    $("bubble").innerHTML = styleTerms(words);
    flagBubble();   // (op) the owner's 🚩 rides the scripted lane too

    var ctl = $("controls"); ctl.innerHTML = "";
    if (step.kind !== "end") lastStep = step;   // (oq) the ✋ knows where to come back to
    if (step.kind === "say") {
      var b = document.createElement("button");
      b.className = "next"; b.textContent = "Next ▶"; b.disabled = true;
      var advanced = false;
      var go = function () { if (!advanced) { advanced = true; playNext(); } };
      b.onclick = go;
      ctl.appendChild(b);
      // AUTO-ADVANCE (Jim's playtest, 2026-08-21: "it looked like I needed to push
      // next to make something happen that it had already talked about"). When the
      // clip has GENUINELY finished playing, the lesson moves itself after a short
      // breath. In SILENT mode (no key, blocked autoplay, an audio error) the Next
      // tap stays required: a reader paces themselves, and racing them would be a
      // worse defect than the stall was.
      if (quiet) { b.disabled = false; }
      else {
        speak(words, function (played) {
          b.disabled = false; b.focus();
          if (played) setTimeout(go, 650);
        }, function () { b.disabled = false; });   // (ke) slow clip: offer Next, keep playing
      }
      // (ov) ...but not inside a quiz. The drive caught this: the guard had been
      // put on the QUESTION beats only, so the ✋ was still sitting there during
      // the quiz's own say beats -- the intro, and every "Right." between
      // questions. A student could have asked for help in the middle of a score.
      if (!QUIZ_ON) askDoor(ctl);   // (oq) a student can raise a hand while he talks
      $("status").textContent = "";
      return;
    }
    if (step.kind === "ask" || step.kind === "ai") {
      current = step;
      var opts = choiceValues(step.choices || step.spoken || "");
      opts.forEach(function (v) {
        var ob = document.createElement("button");
        ob.className = "opt"; ob.textContent = v; ob.disabled = true;
        // (sp, 2026-09-05) THE REASON QUESTION's options are TEXT ("because 8 is 5
        // or bigger"): parseInt would send NaN. The label goes back as `said`, the
        // same field a typed answer uses, and main.py grades it by label in code.
        if (step.reason) ob.onclick = function () { answerSaid(v); };
        else ob.onclick = function () { answer(parseInt(v, 10), ctl); };
        ctl.appendChild(ob);
      });
      // (ou) the free-answer bar opens with the question -- unless the engine has
      // asked for taps only (two unheard answers in a row: the student's voice or
      // typing is not landing, so we stop asking them to use it).
      if (step.tap_only) hideAnswerBar(); else showAnswerBar(step);
      var enable = function () {
        ctl.querySelectorAll("button").forEach(function (x) { x.disabled = false; });
        if (!step.tap_only) setAnswerBar(true);
      };
      // (ov) ...but NEVER during a quiz: the raised hand is a teaching door, and a
      // score earned with help is not a score.
      if (step.kind !== "ai" && !QUIZ_ON) askDoor(ctl);   // (oq) hands stay up during asks too
      if (quiet) enable();
      else speak(words, enable, enable);         // (ke) a slow clip must not lock the answers
      $("status").textContent = step.kind === "ai" ? "Mr. Cadabra is helping — try it again!"
                                                   : (step.tap_only ? "Tap your answer." : "");
      return;
    }
    // ---- (ov) THE TOPIC QUIZ -------------------------------------------------
    // A quiz beat looks like an ask and behaves like nothing else on this page:
    // no ✋ (a raised hand is a teaching door and this is not teaching), no AI,
    // no second try. The answer bar and the tap buttons work exactly as they do
    // in a lesson, because a student should not have to learn a new way to answer
    // in the one place it counts.
    if (step.kind === "qask") {
      current = step;
      choiceValues(step.choices || "").forEach(function (v) {
        var ob = document.createElement("button");
        ob.className = "opt"; ob.textContent = v; ob.disabled = true;
        ob.onclick = function () { quizAnswer(parseInt(v, 10), null, ctl); };
        ctl.appendChild(ob);
      });
      QUIZ_ON = true;
      showAnswerBar(step);
      var qenable = function () {
        ctl.querySelectorAll("button").forEach(function (x) { x.disabled = false; });
        setAnswerBar(true);
      };
      if (quiet) qenable(); else speak(words, qenable, qenable);
      $("status").textContent = "Quiz — question " + step.n + " of " + step.total
        + ". No hints on these!";
      return;
    }
    if (step.kind === "qend") {
      QUIZ_ON = false;
      ctl.innerHTML = "";
      hideAnswerBar();
      $("bubble").innerHTML = (step.passed ? '<span class="confetti">🎉</span> ' : "")
        + styleTerms(step.spoken || "");
      flagBubble();
      // THE SCORE IS DRAWN, NOT SPOKEN -- which is why the audio closure needs
      // seven quiz lines instead of one per possible score, and why the student can
      // look at the number twice.
      var f = boardEl();
      if (f) {
        f.innerHTML = '<div class="qcard ' + (step.passed ? "pass" : "keep") + '">'
          + '<div class="qtop">' + (step.passed ? "PASSED" : "KEEP PRACTISING") + '</div>'
          + '<div class="qscore">' + step.correct + " / " + step.total + '</div>'
          + '<div class="qpct">' + step.pct + '%</div></div>';
      }
      speak(step.spoken || "", function () {});
      $("status").textContent = step.passed
        ? "Topic passed — it's on your dashboard."
        : "Saved. You can retake this quiz any time.";
      endDoors(ctl, !step.passed, true);   // (ov) a pass closes the door; a fail reopens it
      return;
    }
    if (step.kind === "end") {
      // (oy) the segment is FULL only when the lesson actually ended -- the partial
      // fill encourages, the tick tells the truth.
      if (CURRENT_ID) { DONE_IDS[CURRENT_ID] = true; renderDay(); }
      ctl.innerHTML = "";
      $("bubble").innerHTML = (step.mastered ? '<span class="confetti">🎉</span> ' : "")
        + styleTerms(step.spoken || "");
      flagBubble();
      speak(step.spoken || "", function () {});
      $("status").textContent = step.mastered
        ? "Topic mastered — it's on the dashboard."
        : "Saved as still learning — the next session re-teaches it.";
      // (ov) THE QUIZ IS THE FIRST DOOR at the end of a taught topic -- before
      // "next lesson", because the point of finishing a topic is to prove it.
      endDoors(ctl, true);
      current = null;
      return;
    }
  }

  // (ov) the doors at the end of a lesson OR a quiz, in one place so the two
  // endings can never drift apart. THE QUIZ DOOR APPEARS when there is a quiz
  // still worth taking: after the lesson (take it), and after a FAILED quiz
  // (retake it, and the status line has just said so). After a PASS it must not
  // appear -- the drive caught this the wrong way round, offering a student who had
  // just scored 3/3 the same quiz again.
  function endDoors(ctl, offerQuiz, retake) {
    if (offerQuiz && CURRENT_ID) {
      var qb = document.createElement("button");
      qb.className = "next";
      qb.textContent = retake ? "\u{1F4DD} Try the quiz again \u25b6"
                              : "\u{1F4DD} Take the quiz \u25b6";
      qb.onclick = function () { startQuiz(CURRENT_ID); };
      ctl.appendChild(qb);
    }
    var nextLes = null;
    for (var ni = 0; ni < LESSONLIST.length; ni++) {
      if (LESSONLIST[ni].id === CURRENT_ID && ni + 1 < LESSONLIST.length) {
        nextLes = LESSONLIST[ni + 1];
        break;
      }
    }
    if (nextLes) {
      var nb = document.createElement("button");
      nb.className = offerQuiz ? "opt" : "next";
      nb.textContent = "Next lesson \u25b6 " + nextLes.topic;
      nb.onclick = function () { startLesson(nextLes.id); };
      ctl.appendChild(nb);
    }
    // (op) the way home -- a pilot student is never stranded at slice's end
    var home = document.createElement("button");
    home.className = "opt"; home.textContent = "\u{1F3EB} Back to my classroom";
    home.onclick = function () {
      // (pa) back to THIS course's hub, not the subject picker -- the lessons
      // door is the main road now, so its exit must land where the student was.
      location.href = "/home?code=" + encodeURIComponent(CODE)
        + (window.COURSE ? "&course=" + encodeURIComponent(window.COURSE) : "");
    };
    ctl.appendChild(home);
    var again = document.createElement("button");
    again.className = "opt"; again.textContent = "Play again";
    again.onclick = function () { location.reload(); };
    ctl.appendChild(again);
  }
  function playNext() {
    if (!queue.length) return;
    playStep(queue.shift());
  }
  function ingest(steps) { queue = queue.concat(steps || []); playNext(); }

  // ---------- the two API calls ----------
  function post(url, body, onOk) {
    if (busy) return;
    busy = true;
    var t0 = performance.now();
    fetch(url, { method: "POST", headers: { "Content-Type": "application/json" },
                 body: JSON.stringify(body) })
      .then(function (r) { return r.json().then(function (j) { return { s: r.status, j: j }; }); })
      .then(function (rj) {
        busy = false;
        devline(url.split("/").pop() + " " + Math.round(performance.now() - t0) + "ms");
        if (rj.s !== 200) {
          $("gateMsg").textContent = (rj.j && rj.j.detail) || "Something went wrong.";
          $("gate").classList.remove("hide");
          return;
        }
        onOk(rj.j);
      })
      .catch(function () { busy = false; $("status").textContent = "Connection hiccup — tap again."; });
  }
  // ---------- (oq) THE RAISED HAND ----------
  // A small ✋ during say and ask beats. Tapping it swaps the controls for a
  // question box; the answer plays as spoken words only (the script owns the
  // board), and "Back to the lesson" -- or the clip simply ending -- restores
  // the interrupted step exactly, without re-speaking it.
  function askDoor(ctl) {
    var hb = document.createElement("button");
    hb.type = "button"; hb.className = "opt";
    hb.style.cssText = "font-size:14px;opacity:.85";
    hb.textContent = "\u270B I have a question";
    hb.onclick = function () {
      var snap = lastStep;
      if (!snap) return;
      var box = $("controls"); box.innerHTML = "";
      var inp = document.createElement("input");
      inp.type = "text"; inp.maxLength = 300; inp.placeholder = "Type your question…";
      inp.style.cssText = "flex:1;min-width:230px;font-size:16px;padding:10px 12px;"
        + "border-radius:12px;border:1.5px solid var(--line)";
      var send = document.createElement("button");
      send.className = "next"; send.textContent = "Ask";
      var nvm = document.createElement("button");
      nvm.className = "opt"; nvm.textContent = "Never mind";
      var row = document.createElement("div");
      row.style.cssText = "display:flex;gap:8px;flex-wrap:wrap;align-items:center";
      row.appendChild(inp); row.appendChild(send); row.appendChild(nvm);
      box.appendChild(row);
      inp.focus();
      nvm.onclick = function () { playStep(snap, true); };
      var fire = function () {
        var q = (inp.value || "").trim();
        if (!q) { inp.focus(); return; }
        send.disabled = true; nvm.disabled = true; inp.disabled = true;
        $("status").textContent = "Mr. Cadabra is thinking…";
        post("/api/script/ask", { code: CODE, question: q,
                                  heard: ($("bubble").textContent || "").slice(0, 300),
                                  pending: (snap.kind === "ask"
                                            ? spokenOnly(snap.spoken || "").slice(0, 200) : "") },
             function (j) {
               var words = spokenOnly(j.answer || "");
               $("bubble").innerHTML = styleTerms(words);
               flagBubble();
               $("status").textContent = "";
               var box2 = $("controls"); box2.innerHTML = "";
               var back = document.createElement("button");
               back.className = "next"; back.textContent = "\u25B6 Back to the lesson";
               back.disabled = true;
               var resumed = false;
               var resume = function () { if (!resumed) { resumed = true; playStep(snap, true); } };
               back.onclick = resume;
               box2.appendChild(back);
               speak(words, function (played) {
                 back.disabled = false; back.focus();
                 if (played) setTimeout(resume, 900);
               }, function () { back.disabled = false; });
             });
      };
      send.onclick = fire;
      inp.addEventListener("keydown", function (ev) { if (ev.key === "Enter") fire(); });
    };
    ctl.appendChild(hb);
  }

  // ---- (ou) ANSWER IN YOUR OWN WORDS -------------------------------------
  // The tap buttons stay exactly as they were -- this is an ADDITION beside them.
  // Typed text and transcribed speech travel the same road: `said` on the same
  // POST, read by code on the server (lessonscripts.read_answer), never a model.
  function showAnswerBar(step) {
    var bar = $("answerbar");
    bar.hidden = false;
    $("sayInput").value = "";
    live.textContent = "";
    hint.textContent = canRecord
      ? "Say your answer out loud, type it, or tap one of the buttons."
      : "Type your answer and press Enter — or tap one of the buttons.";
    talkBtn.hidden = !canRecord;
    lastTutorText = step.spoken || "";      // mic.js reads this for expect=letter
    setAnswerBar(false);
  }
  function setAnswerBar(on) {
    var bar = $("answerbar");
    if (bar.hidden) return;
    $("sayInput").disabled = !on;
    $("sendBtn").disabled = !on;
    setPhase(on ? "ready" : "busy");
  }
  function hideAnswerBar() {
    $("answerbar").hidden = true;
    setPhase("idle");
    hint.textContent = ""; live.textContent = "";
  }
  function sendSaid() {
    var t = ($("sayInput").value || "").trim();
    if (!t || busy) return;
    live.textContent = t;                    // the student sees what we heard
    answerSaid(t);
  }
  function answerSaid(text) {
    if (busy) return;
    live.textContent = text;
    setAnswerBar(false);
    var ctl = $("controls");
    ctl.querySelectorAll("button").forEach(function (x) { x.disabled = true; });
    if (QUIZ_ON) { quizAnswer(null, text, ctl); return; }   // (ov) one bar, two graders
    bumpLesson();                            // (oy) a typed answer counts the same
    post("/api/script/answer", { code: CODE, said: text }, function (j) {
      current = null;
      hideAnswerBar();
      ingest(j.steps);
    });
  }
  // mic.js hands its finished transcript to sendToTutor, which calls this.
  window.__pilotSaid = function (text) { answerSaid(text); };
  $("sendBtn").onclick = sendSaid;
  $("sayInput").addEventListener("keydown", function (ev) {
    if (ev.key === "Enter") { ev.preventDefault(); sendSaid(); }
  });
  // ONE tap starts recording, the next sends it -- mic.js owns both sides.
  talkBtn.onclick = function () {
    if (phase === "recording") stopRecording(true);
    else startRecording();
  };

  // ---- (ov) THE TOPIC QUIZ ------------------------------------------------
  // Its own two calls, deliberately separate from the lesson's: a quiz must not
  // be able to reach the teaching routes, and the teaching routes must not be
  // able to reach a quiz's grading.
  function startQuiz(lessonId) {
    QUIZ_ON = true;
    queue = [];
    $("controls").innerHTML = "";
    hideAnswerBar();
    post("/api/script/quiz/start", { code: CODE, lesson: lessonId }, function (j) {
      if (!j.ok) {            // this lesson cannot field a quiz -- say so, do not stall
        QUIZ_ON = false;
        $("status").textContent = "No quiz for this topic yet — the lesson is saved.";
        endDoors($("controls"), false);
        return;
      }
      current = null;
      ingest(j.steps);
    });
  }
  function quizAnswer(value, said, ctl) {
    if (ctl) ctl.querySelectorAll("button").forEach(function (x) { x.disabled = true; });
    setAnswerBar(false);
    var body = { code: CODE };
    if (said) body.said = said; else body.value = value;
    post("/api/script/quiz/answer", body, function (j) {
      current = null;
      hideAnswerBar();
      ingest(j.steps);
    });
  }

  function answer(value, ctl) {
    ctl.querySelectorAll("button").forEach(function (x) { x.disabled = true; });
    hideAnswerBar();
    bumpLesson();                            // (oy) the day strip moves on every answer
    post("/api/script/answer", { code: CODE, value: value }, function (j) {
      current = null;
      ingest(j.steps);
    });
  }
  // (mh) THE TEST SEAM MOVED WITH THE DISPATCHER: window.__drawBoard is set by
  // script-board.js now, so the browser proof that draws one tag in isolation
  // works unchanged on this page and on the drill page.

  // (ka) the Start button is gone -- tapping a lesson starts it; see startLesson().
})();
</script>
</body>
</html>
